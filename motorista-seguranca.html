<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Interliga Motorista — Teste Segurança</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060C1A}#appFrame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="appFrame" src="motorista.html" title="Interliga Motorista"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('interliga-selfie-seguranca-script')) return;
    const s=doc.createElement('script');
    s.id='interliga-selfie-seguranca-script';
    s.src='motorista-selfie-seguranca.js?v=1';
    doc.body.appendChild(s);
  }catch(e){console.error('[motorista-seguranca] erro ao injetar módulo:',e);}
});
</script>
</body>
</html>
