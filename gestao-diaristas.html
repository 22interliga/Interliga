<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Gestão de Limpeza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf1ef; --surface:#ffffff; --surface-2:#f4f8f7;
    --ink:#132e28; --muted:#5f736c; --line:#dbe7e2;
    --primary:#0f766e; --primary-d:#0b5d57; --primary-soft:#d6ebe7;
    --ok:#15803d; --ok-soft:#dbf1e2; --warn:#b45309; --warn-soft:#fbead2;
    --danger:#b3261e; --danger-soft:#f8dedb;
    --r:14px; --r-sm:10px; --r-lg:20px;
    --shadow:0 1px 2px rgba(19,46,40,.05), 0 8px 24px rgba(19,46,40,.06);
    --nav-h:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:16px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- shell ---------- */
  .app{max-width:820px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
       padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
  header.top{
    position:sticky; top:0; z-index:20; background:rgba(234,241,239,.86);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:14px 18px calc(14px) 18px; display:flex; align-items:center; gap:12px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .mark{width:34px; height:34px; border-radius:10px; background:var(--primary);
        display:grid; place-items:center; color:#fff; flex:none}
  .mark svg{width:19px; height:19px}
  .brand .name{font-weight:800; font-size:16px; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand .sub{font-size:12px; color:var(--muted); margin-top:-2px}
  .top .spacer{flex:1}
  .icon-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
            background:var(--surface); display:grid; place-items:center; color:var(--ink)}
  .icon-btn svg{width:18px; height:18px}

  main{flex:1; padding:18px 18px 26px}
  .view-title{font-size:22px; font-weight:800; letter-spacing:-.4px; margin:2px 0 16px}
  .view-title .day{font-size:13px; font-weight:500; color:var(--muted); display:block; margin-top:1px}

  /* ---------- bottom nav ---------- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
    border-top:1px solid var(--line); display:flex;
  }
  nav.tabs .inner{max-width:820px; margin:0 auto; width:100%; display:flex}
  .tab{flex:1; background:none; border:none; color:var(--muted);
       display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
       font-size:11px; font-weight:600; padding:8px 2px}
  .tab svg{width:22px; height:22px; stroke-width:2}
  .tab.active{color:var(--primary)}
  .tab.active .ic{background:var(--primary-soft); }
  .tab .ic{width:44px; height:26px; border-radius:13px; display:grid; place-items:center; transition:background .15s}

  /* ---------- cards & bits ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .stack>*+*{margin-top:12px}
  .row{display:flex; align-items:center; gap:12px}
  .between{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .tiny{font-size:12px}
  .b{font-weight:700}

  /* money hero */
  .money{background:linear-gradient(158deg,var(--primary),var(--primary-d)); color:#fff;
         border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow)}
  .money .period{font-size:13px; opacity:.85; font-weight:600}
  .money .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:14px}
  .money .cell{padding:2px 0}
  .money .cell .lbl{font-size:11.5px; opacity:.82; font-weight:600}
  .money .cell .val{font-size:19px; font-weight:800; letter-spacing:-.5px; margin-top:3px; line-height:1.1}
  .money .cell.mid{border-left:1px solid rgba(255,255,255,.22); border-right:1px solid rgba(255,255,255,.22); padding-left:12px; padding-right:12px; margin:0 -3px}
  @media(max-width:400px){ .money .val{font-size:17px} }

  .section-h{font-size:13px; font-weight:700; color:var(--muted); margin:22px 2px 10px}

  /* service row */
  .svc{padding:14px; display:flex; gap:12px; align-items:flex-start}
  .svc + .svc{border-top:1px solid var(--line)}
  .svc .time{font-weight:800; font-size:15px; width:52px; flex:none; letter-spacing:-.3px}
  .svc .time small{display:block; font-size:11px; font-weight:600; color:var(--muted)}
  .svc .body{flex:1; min-width:0}
  .svc .who{font-weight:700; font-size:15px}
  .svc .meta{font-size:13px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .svc .side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none}
  .svc .price{font-weight:800; font-size:14px}

  .pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .pill.agendado{background:var(--primary-soft); color:var(--primary-d)}
  .pill.concluido{background:var(--ok-soft); color:var(--ok)}
  .pill.pago{background:var(--ok-soft); color:var(--ok)}
  .pill.pend{background:var(--warn-soft); color:var(--warn)}
  .pill.cancelado{background:var(--danger-soft); color:var(--danger)}
  .pill.repassado{background:var(--ok-soft); color:var(--ok)}

  /* list item generic */
  .item{padding:14px; display:flex; gap:12px; align-items:center}
  .item + .item{border-top:1px solid var(--line)}
  .avatar{width:42px; height:42px; border-radius:12px; background:var(--primary-soft); color:var(--primary-d);
          display:grid; place-items:center; font-weight:800; flex:none; font-size:16px}
  .item .body{flex:1; min-width:0}
  .item .t{font-weight:700; font-size:15px}
  .item .s{font-size:13px; color:var(--muted); margin-top:1px}

  .link-wa{color:var(--primary-d); text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-weight:600; font-size:13px}
  .link-wa svg{width:14px; height:14px}

  /* buttons */
  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink);
       border-radius:var(--r-sm); padding:11px 14px; font-weight:700; font-size:14px;
       display:inline-flex; align-items:center; justify-content:center; gap:7px}
  .btn svg{width:16px; height:16px}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
  .btn.primary:active{background:var(--primary-d)}
  .btn.block{width:100%}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--primary-d); padding:8px 6px}
  .btn.sm{padding:7px 11px; font-size:13px; border-radius:9px}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:#fff}
  .btn.warn{background:var(--warn); border-color:var(--warn); color:#fff}
  .btn.danger-o{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft)}

  .fab{position:fixed; right:calc(50% - 410px + 18px); bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
       z-index:25; background:var(--primary); color:#fff; border:none; border-radius:16px;
       height:52px; padding:0 20px; font-weight:800; font-size:15px; box-shadow:0 8px 20px rgba(15,118,110,.35);
       display:inline-flex; align-items:center; gap:8px}
  .fab svg{width:20px; height:20px}
  @media(max-width:856px){ .fab{right:18px} }

  /* toolbar */
  .toolbar{display:flex; gap:10px; margin-bottom:14px}
  .search{flex:1; position:relative}
  .search input{width:100%; padding:11px 12px 11px 38px; border:1px solid var(--line);
                border-radius:var(--r-sm); background:var(--surface); color:var(--ink)}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted)}

  /* empty */
  .empty{text-align:center; padding:44px 20px; color:var(--muted)}
  .empty .e-ic{width:56px; height:56px; border-radius:18px; background:var(--surface-2); border:1px solid var(--line);
               display:grid; place-items:center; margin:0 auto 14px; color:var(--primary)}
  .empty .e-ic svg{width:26px; height:26px}
  .empty h3{color:var(--ink); font-size:16px; margin:0 0 4px}
  .empty p{margin:0 0 16px; font-size:14px}

  /* modal */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(19,46,40,.42);
           display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .18s}
  .overlay.open{opacity:1; pointer-events:auto}
  .sheet{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0;
         max-height:92vh; overflow-y:auto; transform:translateY(16px); transition:transform .2s;
         padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
  .overlay.open .sheet{transform:translateY(0)}
  @media(min-width:600px){ .overlay{align-items:center} .sheet{border-radius:22px; margin:20px} }
  .grabber{width:40px; height:4px; border-radius:3px; background:var(--line); margin:8px auto 6px}
  .sheet h2{font-size:19px; font-weight:800; letter-spacing:-.3px; margin:6px 0 18px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%; padding:12px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--surface-2); color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
  .field textarea{resize:vertical; min-height:64px}
  .field .hint{font-size:12px; color:var(--muted); margin-top:5px}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .calc-box{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px 14px; margin-bottom:14px}
  .calc-box .between{padding:3px 0}
  .calc-box .between:last-child{border-top:1px dashed var(--line); margin-top:5px; padding-top:8px}
  .sheet-actions{display:flex; gap:10px; margin-top:6px}
  .sheet-actions .btn{flex:1}

  .seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:3px; gap:3px}
  .seg button{flex:1; border:none; background:none; padding:9px; border-radius:8px; font-weight:700; font-size:13px; color:var(--muted)}
  .seg button.on{background:var(--surface); color:var(--primary-d); box-shadow:0 1px 3px rgba(19,46,40,.08)}

  .divider{height:1px; background:var(--line); margin:16px 0}
  .toast{position:fixed; bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
         background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px;
         z-index:80; opacity:0; transition:all .22s; max-width:90%; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .period-nav{display:flex; align-items:center; gap:8px}
  .period-nav .btn{padding:8px 10px}
  .period-nav .lbl{font-weight:800; min-width:120px; text-align:center; text-transform:capitalize}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V8l6-4 6 4v13"/><path d="M9 21v-5h6v5"/></svg>
      </div>
      <div style="min-width:0">
        <div class="name" id="brandName">Gestão de Limpeza</div>
        <div class="sub" id="brandSub">Diaristas</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="openConfig()" aria-label="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="view"></main>
</div>

<button class="fab" id="fab" onclick="fabAction()"></button>

<nav class="tabs"><div class="inner" id="tabbar"></div></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ storage ============ */
const KEY='limpeza:v1';
const DEF={
  config:{negocio:'Gestão de Limpeza', comissao:20, chavePix:''},
  clientes:[], diaristas:[], servicos:[]
};
let db = load();
function load(){ try{ const r=JSON.parse(localStorage.getItem(KEY)); return r? {...structuredClone(DEF),...r, config:{...DEF.config,...(r.config||{})}} : structuredClone(DEF); }catch(e){ return structuredClone(DEF); } }
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ============ helpers ============ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const onlyDigits=s=>(s||'').replace(/\D/g,'');
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function todayISO(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseISO(s); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function fmtDateFull(s){ const d=parseISO(s); return WD[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+' '+MES[d.getMonth()]; }
function addDaysISO(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function ym(s){ return s.slice(0,7); }
function waLink(phone,msg){ const p=onlyDigits(phone); const pre=p.startsWith('55')?p:('55'+p); return 'https://wa.me/'+pre+(msg?('?text='+encodeURIComponent(msg)):''); }

const cliente=id=>db.clientes.find(c=>c.id===id);
const diarista=id=>db.diaristas.find(d=>d.id===id);
function comissaoValor(s){ return Math.round((s.valor*(s.comissaoPct??db.config.comissao)/100)*100)/100; }
function repasse(s){ return Math.round((s.valor-comissaoValor(s))*100)/100; }

let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============ icons ============ */
const IC={
  home:'<path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  broom:'<path d="M19.4 8.6 8.6 19.4"/><path d="m14 5 5 5"/><path d="M18 3 21 6"/><path d="M3 21c2-3 3.5-4.5 5.6-5.6l.4.4c1.5 1.5 2 3 2 5.2H6c-1 0-2 0-3 0z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  wallet:'<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><circle cx="16" cy="14" r="1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  wa:'<path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2z"/><path d="M8.5 7.5c-.3 0-.7.1-1 .5s-1 1-1 2.4 1 2.8 1.2 3 2 3.1 4.8 4.3c2.4 1 2.4.7 2.8.6s1.4-.5 1.6-1.1.2-1 .1-1.1l-1.6-.8c-.2-.1-.5-.2-.7.1l-.7.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.1-.2 0-.4.1-.5l.5-.6c.1-.2.1-.3.2-.5s0-.4 0-.5l-.7-1.7c-.2-.5-.4-.4-.6-.4z" fill="currentColor" stroke="none"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chL:'<path d="m15 18-6-6 6-6"/>', chR:'<path d="m9 18 6-6-6-6"/>'
};
const svg=(p,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ============ nav ============ */
let active='inicio';
const TABS=[['inicio','Início',IC.home],['clientes','Clientes',IC.users],['diaristas','Diaristas',IC.broom],['agenda','Agenda',IC.cal],['financeiro','Financeiro',IC.wallet]];
function renderTabs(){
  document.getElementById('tabbar').innerHTML=TABS.map(([k,l,ic])=>
    `<button class="tab ${active===k?'active':''}" onclick="go('${k}')"><span class="ic">${svg(ic)}</span>${l}</button>`).join('');
}
function go(k){ active=k; render(); window.scrollTo(0,0); }
function fabAction(){
  if(active==='clientes') formCliente();
  else if(active==='diaristas') formDiarista();
  else formServico();
}
function setFab(){
  const f=document.getElementById('fab');
  const map={inicio:'Novo serviço',clientes:'Novo cliente',diaristas:'Nova diarista',agenda:'Novo serviço',financeiro:'Novo serviço'};
  f.innerHTML=svg(IC.plus)+map[active];
}

/* ============ render router ============ */
function render(){
  renderTabs(); setFab();
  document.getElementById('brandName').textContent=db.config.negocio||'Gestão de Limpeza';
  ({inicio:viewInicio,clientes:viewClientes,diaristas:viewDiaristas,agenda:viewAgenda,financeiro:viewFinanceiro}[active])();
}

/* ---------- INÍCIO ---------- */
function viewInicio(){
  const t=todayISO(), mes=ym(t);
  const doMes=db.servicos.filter(s=>ym(s.data)===mes && s.status!=='cancelado');
  const aReceber=doMes.filter(s=>!s.pagoCliente).reduce((a,s)=>a+s.valor,0);
  const suaComissao=doMes.filter(s=>s.status==='concluido').reduce((a,s)=>a+comissaoValor(s),0);
  const aRepassar=doMes.filter(s=>s.status==='concluido'&&!s.repassado).reduce((a,s)=>a+repasse(s),0);

  const hoje=db.servicos.filter(s=>s.data===t && s.status!=='cancelado').sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  const prox=db.servicos.filter(s=>s.data>t && s.status!=='cancelado').sort((a,b)=>a.data.localeCompare(b.data)||(a.hora||'').localeCompare(b.hora||'')).slice(0,5);

  const d=new Date();
  document.getElementById('view').innerHTML=`
    <h1 class="view-title">Início<span class="day">${WDL[d.getDay()]}, ${d.getDate()} de ${MESL[d.getMonth()]}</span></h1>
    <div class="money">
      <div class="period">Este mês · ${MESL[d.getMonth()]}</div>
      <div class="grid">
        <div class="cell"><div class="lbl">A receber</div><div class="val num">${fmt(aReceber)}</div></div>
        <div class="cell mid"><div class="lbl">Sua comissão</div><div class="val num">${fmt(suaComissao)}</div></div>
        <div class="cell"><div class="lbl">A repassar</div><div class="val num">${fmt(aRepassar)}</div></div>
      </div>
    </div>

    <div class="section-h">Serviços de hoje</div>
    ${hoje.length? `<div class="card">${hoje.map(svcRow).join('')}</div>`
      : emptyMini(IC.clock,'Nenhum serviço hoje','Aproveite pra agendar a semana.')}

    ${prox.length? `<div class="section-h">Próximos</div><div class="card">${prox.map(svcRow).join('')}</div>`:''}
  `;
}
function emptyMini(ic,h,p){ return `<div class="card"><div class="empty"><div class="e-ic">${svg(ic)}</div><h3>${h}</h3><p>${p}</p></div></div>`; }

function svcRow(s){
  const c=cliente(s.clienteId), dd=diarista(s.diaristaId);
  const st = s.status==='concluido' ? (s.pagoCliente?'<span class="pill pago">pago</span>':'<span class="pill pend">a receber</span>')
           : s.status==='cancelado' ? '<span class="pill cancelado">cancelado</span>'
           : '<span class="pill agendado">agendado</span>';
  return `<div class="svc" onclick="openServico('${s.id}')">
    <div class="time">${s.hora||'--'}<small>${fmtDate(s.data)}</small></div>
    <div class="body">
      <div class="who">${esc(c?c.nome:'Cliente removido')}</div>
      <div class="meta">${dd?esc(dd.nome):'Sem diarista'}${c&&c.endereco?' · '+esc(c.endereco):''}</div>
    </div>
    <div class="side"><div class="price num">${fmt(s.valor)}</div>${st}</div>
  </div>`;
}

/* ---------- FINANCEIRO ---------- */
let finMes=ym(todayISO());
function viewFinanceiro(){
  const list=db.servicos.filter(s=>ym(s.data)===finMes && s.status!=='cancelado').sort((a,b)=>a.data.localeCompare(b.data)||(a.hora||'').localeCompare(b.hora||''));
  const recebido=list.filter(s=>s.pagoCliente).reduce((a,s)=>a+s.valor,0);
  const aReceber=list.filter(s=>!s.pagoCliente).reduce((a,s)=>a+s.valor,0);
  const comissao=list.filter(s=>s.status==='concluido').reduce((a,s)=>a+comissaoValor(s),0);
  const repassado=list.filter(s=>s.repassado).reduce((a,s)=>a+repasse(s),0);
  const aRepassar=list.filter(s=>s.status==='concluido'&&!s.repassado).reduce((a,s)=>a+repasse(s),0);

  // por diarista (a repassar)
  const porD={};
  list.filter(s=>s.status==='concluido'&&!s.repassado).forEach(s=>{ porD[s.diaristaId]=(porD[s.diaristaId]||0)+repasse(s); });

  const [y,m]=finMes.split('-').map(Number);
  document.getElementById('view').innerHTML=`
    <h1 class="view-title">Financeiro</h1>
    <div class="between" style="margin-bottom:14px">
      <div class="period-nav">
        <button class="btn sm" onclick="finShift(-1)">${svg(IC.chL)}</button>
        <span class="lbl">${MESL[m-1]} ${y}</span>
        <button class="btn sm" onclick="finShift(1)">${svg(IC.chR)}</button>
      </div>
    </div>

    <div class="card" style="padding:16px">
      <div class="between" style="padding:5px 0"><span class="muted small">Recebido dos clientes</span><span class="b num" style="color:var(--ok)">${fmt(recebido)}</span></div>
      <div class="between" style="padding:5px 0"><span class="muted small">A receber</span><span class="b num" style="color:var(--warn)">${fmt(aReceber)}</span></div>
      <div class="divider"></div>
      <div class="between" style="padding:5px 0"><span class="muted small">Sua comissão (concluídos)</span><span class="b num" style="color:var(--primary-d)">${fmt(comissao)}</span></div>
      <div class="between" style="padding:5px 0"><span class="muted small">Já repassado</span><span class="b num">${fmt(repassado)}</span></div>
      <div class="between" style="padding:5px 0"><span class="muted small">A repassar às diaristas</span><span class="b num" style="color:var(--warn)">${fmt(aRepassar)}</span></div>
    </div>

    ${Object.keys(porD).length?`<div class="section-h">A repassar por diarista</div><div class="card">${
      Object.entries(porD).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{const dd=diarista(id); return `<div class="item">
        <div class="avatar">${esc((dd?dd.nome:'?')[0]||'?').toUpperCase()}</div>
        <div class="body"><div class="t">${esc(dd?dd.nome:'—')}</div><div class="s">${fmt(v)} a repassar</div></div>
        ${dd&&dd.whatsapp?`<a class="link-wa" href="${waLink(dd.whatsapp,`Olá ${dd.nome}, seu repasse de ${MESL[m-1]} está em ${fmt(v)}.`)}" target="_blank">${svg(IC.wa)}Avisar</a>`:''}
      </div>`;}).join('')}</div>`:''}

    <div class="section-h">Serviços do mês</div>
    ${list.length?`<div class="card">${list.map(finRow).join('')}</div>`:emptyMini(IC.wallet,'Sem lançamentos','Nenhum serviço neste mês.')}
  `;
}
function finShift(n){ let [y,m]=finMes.split('-').map(Number); m+=n; if(m<1){m=12;y--} if(m>12){m=1;y++} finMes=y+'-'+String(m).padStart(2,'0'); viewFinanceiro(); }
function finRow(s){
  const c=cliente(s.clienteId), dd=diarista(s.diaristaId);
  return `<div class="svc" onclick="openServico('${s.id}')">
    <div class="time">${fmtDate(s.data)}<small>${s.hora||''}</small></div>
    <div class="body">
      <div class="who">${esc(c?c.nome:'—')} <span class="tiny muted">→ ${esc(dd?dd.nome:'—')}</span></div>
      <div class="meta">Comissão ${fmt(comissaoValor(s))} · repasse ${fmt(repasse(s))}</div>
    </div>
    <div class="side">
      <div class="price num">${fmt(s.valor)}</div>
      <div class="row" style="gap:5px">
        ${s.pagoCliente?'<span class="pill pago">recebido</span>':'<span class="pill pend">a receber</span>'}
        ${s.repassado?'<span class="pill repassado">repassado</span>':''}
      </div>
    </div>
  </div>`;
}

function openSheet(html){ document.getElementById('sheet').innerHTML='<div class="grabber"></div>'+html; document.getElementById('overlay').classList.add('open'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }

function formCliente(id){

    <div class="field"><label>Observações</label><textarea id="f_obs" placeholder="Portaria, chave, pet, preferências...">${esc(c.obs||'')}</textarea></div>

    </div>`);
}
function saveCliente(id){
  const nome=val('f_nome').trim(); if(!nome){toast('Informe o nome');return;}
  const o={nome, whatsapp:val('f_wa'), endereco:val('f_end'), frequencia:val('f_freq'), obs:val('f_obs')};
  if(id){ Object.assign(cliente(id),o); } else { db.clientes.push({id:uid(),...o}); }
  save(); closeSheet(); render(); toast('Cliente salvo');
}
function delCliente(id){
  if(db.servicos.some(s=>s.clienteId===id)){ if(!confirm('Esse cliente tem serviços lançados. Excluir mesmo assim? Os serviços continuam no histórico.'))return; }
  else if(!confirm('Excluir este cliente?'))return;
  db.clientes=db.clientes.filter(c=>c.id!==id); save(); closeSheet(); render(); toast('Cliente excluído');
}

/* ---------- SERVIÇO ---------- */
function formServico(id, presetDate){
  if(!db.clientes.length){ toast('Cadastre um cliente primeiro'); go('clientes'); return; }
  if(!db.diaristas.length){ toast('Cadastre uma diarista primeiro'); go('diaristas'); return; }
  const s=id?db.servicos.find(x=>x.id===id):{data:presetDate||todayISO(),hora:'08:00',tipoCobranca:'diaria',recorrencia:'nenhuma',formaPagamento:'PIX'};
  const optsC=db.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}" ${s.clienteId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('');
  const optsD=db.diaristas.filter(d=>d.ativo!==false||d.id===s.diaristaId).sort((a,b)=>a.nome.localeCompare(b.nome)).map(d=>`<option value="${d.id}" ${s.diaristaId===d.id?'selected':''}>${esc(d.nome)}</option>`).join('');
  openSheet(`<h2>${id?'Editar serviço':'Novo serviço'}</h2>
    <div class="field"><label>Cliente</label><select id="f_cli" onchange="scAuto()"><option value="">Selecione</option>${optsC}</select></div>
    <div class="field"><label>Diarista</label><select id="f_dia" onchange="scAuto()"><option value="">Selecione</option>${optsD}</select></div>
    <div class="two">
      <div class="field"><label>Data</label><input id="f_data" type="date" value="${s.data}"></div>
      <div class="field"><label>Hora</label><input id="f_hora" type="time" value="${s.hora||'08:00'}"></div>
    </div>
    <div class="field"><label>Cobrança</label>
      <div class="seg" id="f_cob">
        <button class="${s.tipoCobranca!=='hora'?'on':''}" onclick="segCob('diaria')" type="button">Diária</button>
        <button class="${s.tipoCobranca==='hora'?'on':''}" onclick="segCob('hora')" type="button">Por hora</button>
      </div></div>
    <div class="two">
      <div class="field"><label>Valor cobrado do cliente</label><input id="f_val" type="number" step="0.01" value="${s.valor??''}" placeholder="0,00" inputmode="decimal" oninput="scCalc()"></div>
      <div class="field"><label>Comissão (%)</label><input id="f_com" type="number" step="1" value="${s.comissaoPct??db.config.comissao}" inputmode="numeric" oninput="scCalc()"></div>
    </div>
    <div class="calc-box">
      <div class="between"><span class="muted small">Cliente paga</span><span class="b num" id="cx_total">${fmt(s.valor||0)}</span></div>
      <div class="between"><span class="muted small">Sua comissão</span><span class="b num" id="cx_com" style="color:var(--primary-d)">R$ 0,00</span></div>
      <div class="between"><span class="small b">Repasse à diarista</span><span class="b num" id="cx_rep" style="color:var(--ok)">R$ 0,00</span></div>
    </div>
    <div class="two">
      <div class="field"><label>Forma de pagamento</label><select id="f_forma">${['PIX','Dinheiro','Cartão','Transferência'].map(o=>`<option ${s.formaPagamento===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Repetir</label><select id="f_rec" ${id?'disabled':''}>${[['nenhuma','Não repetir'],['semanal','Toda semana'],['quinzenal','A cada 15 dias']].map(([v,l])=>`<option value="${v}" ${s.recorrencia===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    ${!id?'<div class="hint" style="margin-top:-6px;margin-bottom:12px">Recorrência cria os próximos 12 serviços automaticamente.</div>':''}
    <div class="field"><label>Observação</label><input id="f_obs" value="${esc(s.obs||'')}" placeholder="Opcional"></div>
    <div class="sheet-actions">
      <button class="btn primary block" onclick="saveServico('${id||''}')">${svg(IC.check)}Salvar</button>
    </div>`);
  scCalc();
}
let segCobVal='diaria';
function segCob(v){ segCobVal=v; document.querySelectorAll('#f_cob button').forEach((b,i)=>b.classList.toggle('on',(v==='diaria')===(i===0))); scAuto(); }
function scAuto(){
  // prefill valor/comissão a partir da diarista, se vazio
  const d=diarista(val('f_dia'));
  if(d){ const vEl=document.getElementById('f_val'); if(vEl&&!vEl.value) vEl.value=d.valorBase||''; const cEl=document.getElementById('f_com'); if(cEl) cEl.value=d.comissaoPct??db.config.comissao; }
  scCalc();
}
function scCalc(){
  const v=parseFloat(val('f_val'))||0, pct=parseInt(val('f_com'))||0;
  const com=Math.round(v*pct/100*100)/100, rep=Math.round((v-com)*100)/100;
  document.getElementById('cx_total').textContent=fmt(v);
  document.getElementById('cx_com').textContent=fmt(com);
  document.getElementById('cx_rep').textContent=fmt(rep);
}
function saveServico(id){
  const clienteId=val('f_cli'), diaristaId=val('f_dia');
  if(!clienteId){toast('Selecione o cliente');return;}
  if(!diaristaId){toast('Selecione a diarista');return;}
  const v=parseFloat(val('f_val'))||0; if(v<=0){toast('Informe o valor');return;}
  const base={clienteId,diaristaId, data:val('f_data'), hora:val('f_hora'),
    tipoCobranca:segCobVal, valor:v, comissaoPct:parseInt(val('f_com'))||0,
    formaPagamento:val('f_forma'), obs:val('f_obs')};
  if(id){
    const s=db.servicos.find(x=>x.id===id); Object.assign(s,base);
    save(); closeSheet(); render(); toast('Serviço atualizado'); return;
  }
  // conflito
  const conf=db.servicos.find(s=>s.diaristaId===diaristaId&&s.data===base.data&&s.status!=='cancelado');
  if(conf && !confirm('Essa diarista já tem serviço nesse dia. Agendar mesmo assim?')) return;
  const rec=val('f_rec'); const grupo=rec!=='nenhuma'?uid():null;
  const n = rec==='nenhuma'?1:12; const step = rec==='quinzenal'?14:7;
  let data=base.data;
  for(let i=0;i<n;i++){
    db.servicos.push({id:uid(),...base, data, recorrencia:rec, grupo, status:'agendado', pagoCliente:false, repassado:false});
    data=addDaysISO(data,step);
  }
  save(); closeSheet(); render(); toast(rec==='nenhuma'?'Serviço agendado':'12 serviços criados');
}

/* mensagens de WhatsApp */
function fmtDataMsg(s){ const d=parseISO(s); return WDL[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function msgDiarista(s){
  const c=cliente(s.clienteId), d=diarista(s.diaristaId);
  let m=`Olá ${d?d.nome:''}! Você tem uma faxina agendada:\n\n`;
  m+=`📅 ${fmtDataMsg(s.data)} às ${s.hora||''}\n`;
  m+=`👤 Cliente: ${c?c.nome:'-'}\n`;
  if(c&&c.endereco) m+=`📍 Endereço: ${c.endereco}\n`;
  if(c&&c.obs) m+=`📝 Detalhes do local: ${c.obs}\n`;
  if(s.obs) m+=`📌 Observação: ${s.obs}\n`;
  m+=`\n💵 Valor a receber: ${fmt(repasse(s))}\n\nQualquer coisa, me avise. Obrigado!`;
  return m;
}
function msgCliente(s){
  const c=cliente(s.clienteId), d=diarista(s.diaristaId);
  let m=`Olá ${c?c.nome:''}! Confirmando sua faxina:\n\n`;
  m+=`📅 ${fmtDataMsg(s.data)} às ${s.hora||''}\n`;
  m+=`🧹 Profissional: ${d?d.nome:'-'}\n`;
  m+=`💰 Valor da diária: ${fmt(s.valor)}\n`;
  m+=`💳 Pagamento: ${s.formaPagamento||'-'}\n`;
  if(s.formaPagamento==='PIX' && db.config.chavePix) m+=`🔑 Chave PIX: ${db.config.chavePix}\n`;
  if(s.obs) m+=`📝 ${s.obs}\n`;
  m+=`\nQualquer dúvida, estou à disposição!`;
  return m;
}

/* detalhe do serviço (ações rápidas) */
function openServico(id){
  const s=db.servicos.find(x=>x.id===id); if(!s)return;
  const c=cliente(s.clienteId), d=diarista(s.diaristaId);
  const stTxt={agendado:'Agendado',concluido:'Concluído',cancelado:'Cancelado'}[s.status];
  openSheet(`<h2>Serviço</h2>
    <div class="card" style="padding:14px;margin-bottom:14px">
      <div class="between"><span class="b">${esc(c?c.nome:'—')}</span><span class="pill ${s.status}">${stTxt}</span></div>
      <div class="s muted small" style="margin-top:4px">${fmtDateFull(s.data)} · ${s.hora||''}</div>
      <div class="s muted small">Diarista: ${esc(d?d.nome:'—')}</div>
      ${c&&c.endereco?`<div class="s muted small">${esc(c.endereco)}</div>`:''}
      ${s.obs?`<div class="s muted small">Obs.: ${esc(s.obs)}</div>`:''}
      <div class="divider"></div>
      <div class="between"><span class="muted small">Valor</span><span class="b num">${fmt(s.valor)} · ${s.formaPagamento||''}</span></div>
      <div class="between"><span class="muted small">Sua comissão</span><span class="b num" style="color:var(--primary-d)">${fmt(comissaoValor(s))}</span></div>
      <div class="between"><span class="muted small">Repasse</span><span class="b num" style="color:var(--ok)">${fmt(repasse(s))}</span></div>
    </div>
    <div class="stack">
      ${s.status!=='concluido'&&s.status!=='cancelado'?`<button class="btn ok block" onclick="mark('${id}','concluir')">${svg(IC.check)}Marcar como concluído</button>`:''}
      <div class="two">
        <button class="btn ${s.pagoCliente?'':'primary'}" onclick="mark('${id}','pago')">${s.pagoCliente?'Desmarcar recebido':'Recebi do cliente'}</button>
        <button class="btn ${s.repassado?'':'ok'}" onclick="mark('${id}','repasse')">${s.repassado?'Desmarcar repasse':'Repassei à diarista'}</button>
      </div>
      ${d&&d.whatsapp?`<a class="btn block" href="${waLink(d.whatsapp, msgDiarista(s))}" target="_blank">${svg(IC.wa)}Avisar diarista · endereço e local</a>`:''}
      ${c&&c.whatsapp?`<a class="btn block" href="${waLink(c.whatsapp, msgCliente(s))}" target="_blank">${svg(IC.wa)}Enviar ao cliente · valor e PIX</a>`:''}
      <div class="two">
        <button class="btn" onclick="formServico('${id}')">${svg(IC.edit)}Editar</button>
        <button class="btn danger-o" onclick="delServico('${id}')">${svg(IC.trash)}Excluir</button>
      </div>
      ${s.grupo?`<button class="btn ghost block" onclick="delGrupo('${s.grupo}')">Excluir toda a recorrência</button>`:''}
    </div>`);
}
function mark(id,what){
  const s=db.servicos.find(x=>x.id===id);
  if(what==='concluir') s.status='concluido';
  if(what==='pago') s.pagoCliente=!s.pagoCliente;
  if(what==='repasse'){ s.repassado=!s.repassado; if(s.repassado&&s.status==='agendado') s.status='concluido'; }
  save(); openServico(id); render(); toast('Atualizado');
}
function delServico(id){ if(!confirm('Excluir este serviço?'))return; db.servicos=db.servicos.filter(s=>s.id!==id); save(); closeSheet(); render(); toast('Serviço excluído'); }
function delGrupo(g){ if(!confirm('Excluir todos os serviços dessa recorrência que ainda não foram concluídos?'))return; db.servicos=db.servicos.filter(s=>!(s.grupo===g&&s.status==='agendado')); save(); closeSheet(); render(); toast('Recorrência excluída'); }

/* ============ CONFIG / DADOS ============ */
function openConfig(){
  openSheet(`<h2>Configurações</h2>
    <div class="field"><label>Nome do negócio</label><input id="c_neg" value="${esc(db.config.negocio||'')}"></div>
    <div class="field"><label>Comissão padrão (%)</label><input id="c_com" type="number" value="${db.config.comissao}" inputmode="numeric"><div class="hint">Usada ao cadastrar novas diaristas.</div></div>
    <div class="field"><label>Chave PIX (para receber)</label><input id="c_pix" value="${esc(db.config.chavePix||'')}" placeholder="CPF, telefone, e-mail ou chave aleatória"><div class="hint">Entra no aviso de pagamento enviado ao cliente.</div></div>
    <button class="btn primary block" onclick="saveConfig()">${svg(IC.check)}Salvar</button>
    <div class="divider"></div>
    <div class="section-h" style="margin-top:0">Backup dos dados</div>
    <div class="hint" style="margin-bottom:12px">Os dados ficam salvos neste aparelho. Exporte de vez em quando pra não perder.</div>
    <div class="two">
      <button class="btn" onclick="exportar()">Exportar</button>
      <button class="btn" onclick="document.getElementById('imp').click()">Importar</button>
    </div>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importar(this)">
    <button class="btn ghost block" style="color:var(--danger);margin-top:10px" onclick="zerar()">Apagar todos os dados</button>
    <p class="tiny muted" style="text-align:center;margin-top:14px">Feito para ${esc(db.config.negocio||'sua operação')} · v1</p>`);
}
function saveConfig(){ db.config.negocio=val('c_neg')||'Gestão de Limpeza'; db.config.comissao=parseInt(val('c_com'))||0; db.config.chavePix=val('c_pix').trim(); save(); closeSheet(); render(); toast('Configurações salvas'); }
function exportar(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='limpeza-backup-'+todayISO()+'.json'; a.click(); URL.revokeObjectURL(a.href); toast('Backup exportado');
}
function importar(inp){
  const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.clientes||!d.servicos)throw 0;
    if(!confirm('Isso substitui os dados atuais deste aparelho. Continuar?'))return;
    db={...structuredClone(DEF),...d, config:{...DEF.config,...(d.config||{})}}; save(); closeSheet(); render(); toast('Dados importados');
  }catch(e){ toast('Arquivo inválido'); } };
  r.readAsText(f);
}
function zerar(){ if(!confirm('Apagar TODOS os clientes, diaristas e serviços deste aparelho? Não dá pra desfazer.'))return; if(!confirm('Tem certeza mesmo?'))return; localStorage.removeItem(KEY); db=structuredClone(DEF); closeSheet(); render(); toast('Tudo apagado'); }

/* ============ util ============ */
function val(id){ const el=document.getElementById(id); return el?el.value:''; }

/* init */
render();
</script>
</body>
