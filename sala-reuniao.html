<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala de Reunião · Interliga Tecnologia</title>
<style>
  :root{
    --bg: #0a0e16;
    --bg-elev: #12172a;
    --bg-elev-2: #1a2036;
    --silver: #c9ced9;
    --silver-dim: #8890a0;
    --gold: #dfaf58;
    --gold-bright: #f2c066;
    --blue: #3e7bfa;
    --danger: #e5484d;
    --danger-bright: #ff6166;
    --radius: 14px;
    --radius-sm: 9px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--silver);
    overflow:hidden;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- LOBBY ---------- */
  #tela-lobby{
    height:100%; display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; overflow:auto;
  }
  #tela-lobby::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 700px 500px at 82% 20%, rgba(62,123,250,0.10), transparent 60%),
      radial-gradient(ellipse 500px 400px at 10% 85%, rgba(223,175,88,0.06), transparent 60%);
  }
  .orbit{
    position:absolute; top:-120px; right:-120px; width:420px; height:420px;
    opacity:0.35; pointer-events:none;
  }
  .orbit circle{ animation: spin 40s linear infinite; transform-origin:210px 210px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .orbit circle{ animation:none; } }

  .lobby-card{
    position:relative; z-index:1; width:100%; max-width:920px;
    display:grid; grid-template-columns:1.1fr 1fr; gap:32px;
    background:var(--bg-elev); border:1px solid rgba(255,255,255,0.06);
    border-radius:20px; padding:32px; box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  @media (max-width:760px){ .lobby-card{ grid-template-columns:1fr; } }

  .brand-row{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .brand-mark{
    width:30px; height:30px; border-radius:50%; border:2px solid var(--gold);
    position:relative; flex:none;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:8px; border-radius:50%; background:var(--gold);
  }
  .brand-name{ font-weight:700; letter-spacing:0.5px; color:#eef0f4; font-size:15px; }
  .brand-name b{ color:var(--gold-bright); }

  .preview-wrap{
    position:relative; aspect-ratio:4/3; background:#000; border-radius:var(--radius);
    overflow:hidden; border:1px solid rgba(255,255,255,0.08);
  }
  .preview-wrap video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .preview-avatar{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg-elev-2); font-size:42px; font-weight:700; color:var(--silver-dim);
  }
  .preview-controls{
    position:absolute; left:0; right:0; bottom:12px; display:flex; justify-content:center; gap:10px;
  }
  .icon-btn{
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.12); color:#fff; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); transition:background .15s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.2); }
  .icon-btn.off{ background:var(--danger); }
  .icon-btn.off:hover{ background:var(--danger-bright); }
  .icon-btn svg{ width:20px; height:20px; }

  .lobby-form label{ display:block; font-size:12px; color:var(--silver-dim); margin:14px 0 6px; letter-spacing:0.3px; text-transform:uppercase; }
  .lobby-form input[type=text]{
    width:100%; padding:11px 13px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.12);
    background:var(--bg-elev-2); color:#eef0f4; font-size:14px; outline:none;
  }
  .lobby-form input[type=text]:focus{ border-color:var(--gold); }

  .segmented{ display:flex; background:var(--bg-elev-2); border-radius:var(--radius-sm); padding:4px; gap:4px; }
  .segmented button{
    flex:1; padding:9px 10px; border:none; border-radius:7px; background:transparent;
    color:var(--silver-dim); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s;
  }
  .segmented button.active{ background:var(--gold); color:#1a1305; }
  .segmented button[data-papel="convidado"].active{ background:var(--silver); color:#12172a; }

  .btn-primary{
    margin-top:22px; width:100%; padding:13px; border:none; border-radius:var(--radius-sm);
    background:var(--gold); color:#1a1305; font-weight:700; font-size:14.5px; cursor:pointer;
    transition:filter .15s;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }

  .invite-row{
    display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--silver-dim);
  }
  .invite-row button{
    background:none; border:1px solid rgba(255,255,255,0.15); color:var(--silver);
    padding:6px 10px; border-radius:7px; cursor:pointer; font-size:12px;
  }
  .invite-row button:hover{ border-color:var(--gold); color:var(--gold-bright); }

  /* ---------- CHAMADA ---------- */
  #tela-chamada{ height:100%; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:12px 18px;
    color:var(--silver-dim); font-size:13px;
  }
  .topbar .sala-info{ display:flex; align-items:center; gap:8px; }
  .dot-live{ width:8px; height:8px; border-radius:50%; background:#3ddc84; box-shadow:0 0 0 3px rgba(61,220,132,0.15); }

  .grid-wrap{ flex:1; padding:0 18px; overflow:hidden; }
  #grid{
    height:100%; display:grid; gap:12px; grid-template-columns:repeat(2,1fr); align-content:center;
  }
  #grid[data-n="1"]{ grid-template-columns:1fr; }
  #grid[data-n="2"]{ grid-template-columns:repeat(2,1fr); }
  #grid[data-n="3"], #grid[data-n="4"]{ grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); }
  #grid[data-n="5"], #grid[data-n="6"]{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); }
  #grid[data-n="7"], #grid[data-n="8"]{ grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); }

  .tile{
    position:relative; background:#000; border-radius:var(--radius); overflow:hidden;
    border:1px solid rgba(255,255,255,0.08); min-height:0;
  }
  .tile video{ width:100%; height:100%; object-fit:cover; }
  .tile.local video{ transform:scaleX(-1); }
  .tile.local.sem-espelho video{ transform:none; }
  .tile .avatar{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg-elev-2); font-size:clamp(20px,4vw,40px); font-weight:700; color:var(--silver-dim);
  }
  .tile .label{
    position:absolute; left:10px; bottom:9px; display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,0.45); backdrop-filter:blur(4px); padding:5px 9px; border-radius:7px;
    font-size:12.5px; color:#fff; max-width:calc(100% - 20px);
  }
  .tile .label .nome{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile .mic-off-ic{ width:13px; height:13px; flex:none; color:var(--danger-bright); }

  /* diretoria: moldura dourada + marca d'água da Interliga */
  .tile.diretoria{ border:1.5px solid rgba(223,175,88,0.55); box-shadow:0 0 0 1px rgba(223,175,88,0.12) inset; }
  .tile.diretoria .label{ border-left:2px solid var(--gold); }
  .tile.diretoria .brand-wm{
    position:absolute; top:9px; right:10px; width:20px; height:20px; border-radius:50%;
    border:1.5px solid var(--gold); opacity:0.85;
  }
  .tile.diretoria .brand-wm::after{ content:""; position:absolute; inset:5px; border-radius:50%; background:var(--gold); }

  /* convidado: moldura neutra, sem marca */
  .tile.convidado{ border:1px solid rgba(255,255,255,0.14); }
  .tile.convidado .label{ border-left:2px solid var(--silver-dim); }

  .controlbar{
    display:flex; align-items:center; justify-content:center; gap:12px; padding:16px 0 22px;
  }
  .ctl{
    width:50px; height:50px; border-radius:50%; border:none; cursor:pointer;
    background:var(--bg-elev-2); color:#fff; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .ctl:hover{ background:#232a45; }
  .ctl.off{ background:var(--danger); }
  .ctl.off:hover{ background:var(--danger-bright); }
  .ctl.active{ background:var(--gold); color:#1a1305; }
  .ctl svg{ width:22px; height:22px; }
  .ctl.leave{ background:var(--danger); width:64px; border-radius:26px; }
  .ctl.leave:hover{ background:var(--danger-bright); }

  #painel-arquivos{
    position:fixed; top:56px; right:18px; width:260px; max-height:260px; overflow:auto;
    background:var(--bg-elev); border:1px solid rgba(255,255,255,0.1); border-radius:12px;
    padding:10px; z-index:15; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  #painel-arquivos .titulo{ font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--silver-dim); margin-bottom:6px; }
  #painel-arquivos a{
    display:block; padding:7px 8px; border-radius:7px; color:var(--silver); text-decoration:none;
    font-size:13px; background:var(--bg-elev-2); margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #painel-arquivos a:hover{ color:var(--gold-bright); }
  #painel-arquivos .quem{ font-size:11px; color:var(--silver-dim); }
  .ctl.tem-arquivo::after{
    content:""; position:absolute; width:9px; height:9px; border-radius:50%; background:var(--gold);
    margin-left:28px; margin-top:-38px;
  }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--bg-elev-2); border:1px solid rgba(255,255,255,0.1); color:var(--silver);
    padding:9px 16px; border-radius:9px; font-size:13px; z-index:20; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<!-- ============ LOBBY ============ -->
<div id="tela-lobby">
  <svg class="orbit" viewBox="0 0 420 420">
    <circle cx="210" cy="210" r="150" fill="none" stroke="#dfaf58" stroke-width="1" stroke-dasharray="2 10"/>
    <circle cx="210" cy="210" r="190" fill="none" stroke="#3e7bfa" stroke-width="1" stroke-dasharray="1 14"/>
  </svg>

  <div class="lobby-card">
    <div>
      <div class="brand-row">
        <div class="brand-mark"></div>
        <div class="brand-name">INTERLIGA <b>TECNOLOGIA</b></div>
      </div>
      <div class="preview-wrap">
        <video id="video-preview" autoplay playsinline muted></video>
        <div class="preview-avatar" id="preview-avatar">?</div>
        <div class="preview-controls">
          <button class="icon-btn" id="btn-mic-lobby" title="Microfone">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          </button>
          <button class="icon-btn" id="btn-cam-lobby" title="Câmera">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="lobby-form">
      <div style="font-size:20px;font-weight:700;color:#eef0f4;">Sala de Reunião</div>
      <div style="font-size:13px;color:var(--silver-dim);margin-top:4px;">Entre com seu nome e seu papel na reunião.</div>

      <label>Seu nome</label>
      <input type="text" id="input-nome" placeholder="Ex.: Miquéias" autocomplete="off">

      <label>Você é</label>
      <div class="segmented">
        <button type="button" data-papel="diretoria" class="active">Diretoria</button>
        <button type="button" data-papel="convidado">Convidado</button>
      </div>

      <label>Sala</label>
      <input type="text" id="input-sala" placeholder="id-da-sala" autocomplete="off">

      <button class="btn-primary" id="btn-entrar" disabled>Ativando câmera…</button>

      <div class="invite-row">
        <span>Link da sala:</span>
        <button id="btn-copiar-link" type="button">Copiar convite</button>
      </div>
      <div id="lobby-erro" style="color:var(--danger-bright); font-size:12.5px; margin-top:10px;"></div>
    </div>
  </div>
</div>

<!-- ============ CHAMADA ============ -->
<div id="tela-chamada" class="hidden">
  <div class="topbar">
    <div class="sala-info">
      <span class="dot-live"></span>
      <span id="sala-nome-label">sala</span>
      <span id="cronometro">00:00</span>
    </div>
    <div id="contagem-participantes">1 participante</div>
  </div>

  <div class="grid-wrap">
    <div id="grid" data-n="1"></div>
  </div>

  <div id="painel-arquivos" class="hidden"></div>

  <div class="controlbar">
    <button class="ctl" id="ctl-mic" title="Microfone">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button class="ctl" id="ctl-cam" title="Câmera">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>
    <button class="ctl" id="ctl-share" title="Compartilhar tela (só no computador)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-6v2h3v2H7v-2h3v-2H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v9h14V6H5z"/></svg>
    </button>
    <button class="ctl" id="ctl-arquivo" title="Enviar arquivo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6.5v9a4.5 4.5 0 0 1-9 0v-10a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7H9v8a3 3 0 0 0 6 0V5.5A4.5 4.5 0 0 0 6 5.5v10a6 6 0 0 0 12 0v-9h-1.5z"/></svg>
    </button>
    <input type="file" id="input-arquivo" hidden>
    <button class="ctl leave" id="ctl-sair" title="Sair da reunião">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 3.5a1 1 0 0 1 1-.1c1.3.5 2.6 1.1 3.8 1.9a1 1 0 0 1 .3 1.4l-1.4 2.1a1 1 0 0 0 .1 1.2c1 1.2 2.2 2.4 3.4 3.4a1 1 0 0 0 1.2.1l2.1-1.4a1 1 0 0 1 1.4.3c.8 1.2 1.4 2.5 1.9 3.8a1 1 0 0 1-.3 1.1c-.8.7-1.8 1.1-2.9 1.1-6.6 0-13-6.4-13-13 0-1.1.4-2.1 1.1-2.9z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   SALA DE REUNIÃO — INTERLIGA TECNOLOGIA
   WebRTC (mesh) + Firestore como sinalização. Pensado para 5–8 pessoas.

   IMPORTANTE — PROJETO FIREBASE SEPARADO:
   Esta sala usa um projeto Firebase PRÓPRIO, diferente do interliga-mobilidade
   (o do app). Assim as regras e a cota de leitura/escrita da sala não se
   misturam com o Interliga app nem com os painéis de gestão. Não cole o
   firebaseConfig do app aqui — crie um projeto novo só pra isso.

   ANTES DE USAR:
   1) console.firebase.google.com → Adicionar projeto → nome sugerido:
      "interliga-sala-reuniao" (ou "interliga-meet").
   2) Nesse projeto novo: Authentication > Sign-in method > ative "Anônimo".
   3) Nesse projeto novo: Firestore Database > criar banco (modo produção).
   4) Nesse projeto novo: Firestore > Regras > cole ESTE arquivo INTEIRO
      (pode substituir tudo, já que o projeto é exclusivo da sala):

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /salas/{salaId} {
              allow read, write: if request.auth != null;
              match /{document=**} {
                allow read, write: if request.auth != null;
              }
            }
          }
        }

   5) Configurações do projeto > Seus apps > Web > copie o firebaseConfig
      e cole logo abaixo.

   Limitações desta primeira versão (documentadas de propósito):
   - Sem servidor TURN: em redes corporativas com firewall restritivo,
     a conexão entre dois participantes pode falhar (funciona bem em
     redes domésticas/4G normais). Se acontecer, dá pra adicionar um
     TURN (ex.: Twilio, Xirsys ou um coturn próprio) depois.
   - Malha (mesh): cada participante conecta direto com todos os outros.
     Ótimo até uns 8; acima disso a qualidade cai.
   - Limpeza de sala é "best-effort" (ao sair/fechar a aba); documentos
     antigos podem sobrar no Firestore — sem problema de custo em uso
     interno, mas dá pra criar uma limpeza automática depois.
===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, updateDoc, deleteDoc, getDoc,
  collection, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

// Projeto Firebase exclusivo desta sala: interliga-sala-reuniao
const firebaseConfig = {
  apiKey: "AIzaSyBtMIVGBPNieHWPM3mY7g8BcpidEWcG4pY",
  authDomain: "interliga-sala-reuniao.firebaseapp.com",
  projectId: "interliga-sala-reuniao",
  storageBucket: "interliga-sala-reuniao.firebasestorage.app",
  messagingSenderId: "298541768952",
  appId: "1:298541768952:web:bffc896e8a7f2f3e5fdb0d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
];

// ---------------- Fundo virtual (recorte de pessoa via MediaPipe) ----------------
async function iniciarFundoVirtual(){
  try{
    const mod = await import(VISION_BUNDLE_URL);
    const { ImageSegmenter, FilesetResolver } = mod;
    const fileset = await FilesetResolver.forVisionTasks(VISION_WASM_URL);

    try{
      imageSegmenter = await ImageSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: SEGMENTER_MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO", outputCategoryMask: true, outputConfidenceMasks: false
      });
    }catch(eGpu){
      imageSegmenter = await ImageSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: SEGMENTER_MODEL_URL, delegate: "CPU" },
        runningMode: "VIDEO", outputCategoryMask: true, outputConfidenceMasks: false
      });
    }

    segRawVideo = document.createElement("video");
    segRawVideo.muted = true; segRawVideo.playsInline = true; segRawVideo.autoplay = true;
    segRawVideo.srcObject = localStream;
    await segRawVideo.play().catch(()=>{});
    if(!segRawVideo.videoWidth){
      await new Promise(res=>segRawVideo.addEventListener("loadedmetadata", res, { once:true }));
    }

    const w = segRawVideo.videoWidth || 640, h = segRawVideo.videoHeight || 480;
    segWorkCanvas = document.createElement("canvas");
    segWorkCanvas.width = w; segWorkCanvas.height = h;
    segWorkCtx = segWorkCanvas.getContext("2d");

    segBgCanvas = document.createElement("canvas");
    segBgCanvas.width = w; segBgCanvas.height = h;
    segBgCtx = segBgCanvas.getContext("2d");

    await new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.max(w / img.width, h / img.height);
        const iw = img.width * scale, ih = img.height * scale;
        segBgCtx.drawImage(img, (w - iw) / 2, (h - ih) / 2, iw, ih);
        resolve();
      };
      img.onerror = resolve;
      img.src = FUNDO_DIRETORIA_URL;
    });

    const segOutStream = segWorkCanvas.captureStream(25);
    outgoingVideoTrack = segOutStream.getVideoTracks()[0];
    fundoVirtualAtivo = true;
    requestAnimationFrame(processarFrameSegmentacao);
    return true;
  }catch(e){
    console.warn("Fundo virtual indisponível:", e);
    fundoVirtualAtivo = false;
    return false;
  }
}

function processarFrameSegmentacao(){
  if(!fundoVirtualAtivo) return;
  if(sharing){ requestAnimationFrame(processarFrameSegmentacao); return; }
  if(segRawVideo.currentTime !== segLastTime){
    segLastTime = segRawVideo.currentTime;
    imageSegmenter.segmentForVideo(segRawVideo, performance.now(), compositarFundo);
  } else {
    requestAnimationFrame(processarFrameSegmentacao);
  }
}

function compositarFundo(result){
  const w = segWorkCanvas.width, h = segWorkCanvas.height;
  segWorkCtx.drawImage(segRawVideo, 0, 0, w, h);
  const frame = segWorkCtx.getImageData(0, 0, w, h);
  const bg = segBgCtx.getImageData(0, 0, w, h);
  const mask = result.categoryMask.getAsFloat32Array();

  for(let i = 0, j = 0; i < mask.length; i++, j += 4){
    if(Math.round(mask[i]) === 0){ // 0 = fundo no modelo selfie_segmenter
      frame.data[j] = bg.data[j];
      frame.data[j+1] = bg.data[j+1];
      frame.data[j+2] = bg.data[j+2];
      frame.data[j+3] = bg.data[j+3];
    }
  }
  segWorkCtx.putImageData(frame, 0, 0);
  if(result.categoryMask.close) result.categoryMask.close();
  requestAnimationFrame(processarFrameSegmentacao);
}

function atualizarCronometro(){
  const s = Math.floor((Date.now()-inicioChamada)/1000);
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  cronometroEl.textContent = `${mm}:${ss}`;
}

// ---------------- Grade de vídeo ----------------
function recalcularGrade(){
  const n = grid.children.length;
  grid.dataset.n = String(Math.min(n,8));
  contagemParticipantes.textContent = n === 1 ? "1 participante" : `${n} participantes`;
}

function criarTile(uid, nome, papel, isLocal, camOnInicial){
  const tile = document.createElement("div");
  tile.className = `tile ${papel === "diretoria" ? "diretoria" : "convidado"}${isLocal ? " local" : ""}`;
  tile.id = `tile-${uid}`;

  const video = document.createElement("video");
  video.autoplay = true; video.playsInline = true;
  if(isLocal) video.muted = true;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = inicial(nome);
  // some se já sabemos que a câmera dessa pessoa está ligada; senão fica de placeholder até o vídeo chegar
  if(camOnInicial === true) avatar.classList.add("hidden");

  const label = document.createElement("div");
  label.className = "label";
  const nomeSpan = document.createElement("span");
  nomeSpan.className = "nome";
  nomeSpan.textContent = isLocal ? `${nome} (você)` : nome;
  label.appendChild(nomeSpan);

  tile.appendChild(video);
  tile.appendChild(avatar);
  tile.appendChild(label);

  if(papel === "diretoria"){
    const wm = document.createElement("div");
    wm.className = "brand-wm";
    tile.appendChild(wm);
  }

  grid.appendChild(tile);
  recalcularGrade();
  return { tile, video, avatar };
}

function criarTileLocal(){
  const { tile, video, avatar } = criarTile(myUid, myNome, myPapel, true, camOn);
  if(fundoVirtualAtivo){
    tile.classList.add("sem-espelho");
  }
  if(fundoVirtualAtivo && outgoingVideoTrack){
    video.srcObject = new MediaStream([outgoingVideoTrack]);
  } else {
    video.srcObject = localStream;
  }
}

function removerTile(uid){
  const el = document.getElementById(`tile-${uid}`);
  if(el) el.remove();
  recalcularGrade();
}

function atualizarTileRemoto(uid, dados){
  const tile = document.getElementById(`tile-${uid}`);
  if(!tile) return;
  const avatar = tile.querySelector(".avatar");
  const nomeSpan = tile.querySelector(".nome");
  if(nomeSpan) nomeSpan.textContent = dados.nome || "";
  if(avatar) avatar.classList.toggle("hidden", !!dados.camOn);
}

// ---------------- Participantes (presença) ----------------
function escutarParticipantes(){
  const col = collection(db, "salas", salaId, "participantes");
  unsubParticipantes = onSnapshot(col, (snap)=>{
    snap.docChanges().forEach((change)=>{
      const uid = change.doc.id;
      if(uid === myUid) return;
      const dados = change.doc.data();

      if(change.type === "added"){
        participantesCache[uid] = dados;
        criarTile(uid, dados.nome, dados.papel, false, dados.camOn);
        conectarComPeer(uid);
      } else if(change.type === "modified"){
        participantesCache[uid] = dados;
        atualizarTileRemoto(uid, dados);
      } else if(change.type === "removed"){
        delete participantesCache[uid];
        fecharPeer(uid);
        removerTile(uid);
      }
    });
  });
}

// Se alguém fechar a aba sem "Sair" (queda de conexão, navegador fechado à força),
// o registro dela pode ficar preso. Qualquer participante ativo limpa quem sumiu há mais de 35s.
function limparParticipantesFantasmas(){
  const agora = Date.now();
  Object.keys(participantesCache).forEach((uid)=>{
    const dados = participantesCache[uid];
    if(!dados.ultimoPing || agora - dados.ultimoPing > 35000){
      deleteDoc(doc(db,"salas",salaId,"participantes",uid)).catch(()=>{});
    }
  });
}

// ---------------- WebRTC (par a par via Firestore) ----------------
function idDoPar(uidA, uidB){
  return [uidA, uidB].sort().join("_");
}

async function conectarComPeer(remoteUid){
  if(peers[remoteUid]) return;

  const [uidMenor] = [myUid, remoteUid].sort();
  const souCaller = myUid === uidMenor;
  const pairRef = doc(db, "salas", salaId, "pares", idDoPar(myUid, remoteUid));
  const minhasCandCol = collection(pairRef, souCaller ? "candidatosA" : "candidatosB");
  const outrasCandCol = collection(pairRef, souCaller ? "candidatosB" : "candidatosA");

  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const videoEl = document.querySelector(`#tile-${remoteUid} video`);
  peers[remoteUid] = { pc, videoEl, unsubs: [] };

  // vídeo: usa o fundo virtual (Diretoria) quando ativo, senão a câmera crua
  const videoTrackParaEnviar = outgoingVideoTrack || localStream.getVideoTracks()[0];
  if(videoTrackParaEnviar) pc.addTrack(videoTrackParaEnviar, localStream);
  localStream.getAudioTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = (e)=>{
    if(videoEl) videoEl.srcObject = e.streams[0];
    const avatarEl = document.querySelector(`#tile-${remoteUid} .avatar`);
    if(avatarEl) avatarEl.classList.add("hidden");
  };
  pc.onicecandidate = (e)=>{
    if(e.candidate) setDoc(doc(minhasCandCol, String(Date.now()+"-"+Math.random())), e.candidate.toJSON());
  };

  if(souCaller){
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await setDoc(pairRef, { offer: { type: offer.type, sdp: offer.sdp } }, { merge: true });

    const unsub = onSnapshot(pairRef, async (snap)=>{
      const d = snap.data();
      if(d && d.answer && pc.signalingState === "have-local-offer"){
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      }
    });
    peers[remoteUid].unsubs.push(unsub);
  } else {
    const unsub = onSnapshot(pairRef, async (snap)=>{
      const d = snap.data();
      if(d && d.offer && pc.signalingState === "stable" && !pc.currentRemoteDescription){
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await updateDoc(pairRef, { answer: { type: answer.type, sdp: answer.sdp } });
      }
    });
    peers[remoteUid].unsubs.push(unsub);
  }

  const unsubCand = onSnapshot(outrasCandCol, (snap)=>{
    snap.docChanges().forEach((c)=>{
      if(c.type === "added"){
        pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{});
      }
    });
  });
  peers[remoteUid].unsubs.push(unsubCand);
}

function fecharPeer(uid){
  const p = peers[uid];
  if(!p) return;
  p.unsubs.forEach(fn=>fn());
  p.pc.close();
  delete peers[uid];
}

// ---------------- Controles ----------------
ctlMic.addEventListener("click", async ()=>{
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t=>t.enabled = micOn);
  ctlMic.classList.toggle("off", !micOn);
  await updateDoc(doc(db,"salas",salaId,"participantes",myUid), { micOn });
});

ctlCam.addEventListener("click", async ()=>{
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t=>t.enabled = camOn);
  ctlCam.classList.toggle("off", !camOn);
  const avatar = document.querySelector(`#tile-${myUid} .avatar`);
  if(avatar) avatar.classList.toggle("hidden", camOn);
  await updateDoc(doc(db,"salas",salaId,"participantes",myUid), { camOn });
});

ctlShare.addEventListener("click", async ()=>{
  if(!sharing){
    try{
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video:true });
    }catch(e){ return; }
    const screenTrack = screenStream.getVideoTracks()[0];
    Object.values(peers).forEach(p=>{
      const sender = p.pc.getSenders().find(s=>s.track && s.track.kind === "video");
      if(sender) sender.replaceTrack(screenTrack);
    });
    const localVideo = document.querySelector(`#tile-${myUid} video`);
    if(localVideo) localVideo.srcObject = screenStream;
    sharing = true;
    ctlShare.classList.add("active");
    screenTrack.onended = pararCompartilhamento;
  } else {
    pararCompartilhamento();
  }
});

function pararCompartilhamento(){
  const camTrack = outgoingVideoTrack || localStream.getVideoTracks()[0];
  Object.values(peers).forEach(p=>{
    const sender = p.pc.getSenders().find(s=>s.track && s.track.kind === "video");
    if(sender && camTrack) sender.replaceTrack(camTrack);
  });
  const localVideo = document.querySelector(`#tile-${myUid} video`);
  if(localVideo){
    localVideo.srcObject = fundoVirtualAtivo ? new MediaStream([camTrack]) : localStream;
  }
  if(screenStream) screenStream.getTracks().forEach(t=>t.stop());
  sharing = false;
  ctlShare.classList.remove("active");
  if(fundoVirtualAtivo) requestAnimationFrame(processarFrameSegmentacao);
}

ctlSair.addEventListener("click", async ()=>{
  await sair();
  location.href = location.pathname;
});

async function sair(){
  if(cronometroInterval) clearInterval(cronometroInterval);
  if(heartbeatInterval) clearInterval(heartbeatInterval);
  if(limpezaInterval) clearInterval(limpezaInterval);
  if(unsubParticipantes) unsubParticipantes();
  Object.keys(peers).forEach(fecharPeer);
  fundoVirtualAtivo = false;
  if(imageSegmenter && imageSegmenter.close) try{ imageSegmenter.close(); }catch(e){}
  if(outgoingVideoTrack) try{ outgoingVideoTrack.stop(); }catch(e){}
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  if(screenStream) screenStream.getTracks().forEach(t=>t.stop());
  try{ await deleteDoc(doc(db,"salas",salaId,"participantes",myUid)); }catch(e){}
}

function sairSilenciosamente(){
  try{ deleteDoc(doc(db,"salas",salaId,"participantes",myUid)); }catch(e){}
}

// ---------------- Enviar arquivo (documentos, planilhas, slides) ----------------
ctlArquivo.addEventListener("click", ()=> inputArquivo.click());

inputArquivo.addEventListener("change", async ()=>{
  const file = inputArquivo.files[0];
  inputArquivo.value = "";
  if(!file) return;
  if(file.size > MAX_ARQUIVO_BYTES){
    toast(`Arquivo muito grande (máx. ${Math.round(MAX_ARQUIVO_BYTES/1024)} KB).`);
    return;
  }
  try{
    const dados = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const ref = doc(collection(db, "salas", salaId, "arquivos"));
    await setDoc(ref, {
      nome: file.name, dados, enviadoPor: myNome, quando: serverTimestamp()
    });
    toast("Arquivo enviado.");
  }catch(e){
    console.error(e);
    toast("Não consegui enviar o arquivo.");
  }
});

function escutarArquivos(){
  const col = collection(db, "salas", salaId, "arquivos");
  onSnapshot(col, (snap)=>{
    const carga = primeiraCargaArquivos;
    snap.docChanges().forEach((change)=>{
      if(change.type !== "added") return;
      const d = change.doc.data();
      adicionarLinkArquivo(d.nome, d.dados, d.enviadoPor);
      if(!carga && d.enviadoPor !== myNome) toast(`${d.enviadoPor} enviou um arquivo: ${d.nome}`);
    });
    primeiraCargaArquivos = false;
  });
}

function adicionarLinkArquivo(nome, dadosUrl, enviadoPor){
  painelArquivos.classList.remove("hidden");
  if(!painelArquivos.querySelector(".titulo")){
    const titulo = document.createElement("div");
    titulo.className = "titulo";
    titulo.textContent = "Arquivos da reunião";
    painelArquivos.appendChild(titulo);
  }
  const a = document.createElement("a");
  a.href = dadosUrl;
  a.download = nome;
  a.textContent = nome;
  const quem = document.createElement("div");
  quem.className = "quem";
  quem.textContent = `enviado por ${enviadoPor}`;
  a.appendChild(document.createElement("br"));
  a.appendChild(quem);
  painelArquivos.appendChild(a);
}
</script>
