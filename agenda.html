<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Agenda • Interliga</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body { background:#f8fafc; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar{ height:6px; width:6px } ::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:3px }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ================================================================== *
 *  CONFIG DO FIREBASE
 *  Cole abaixo o MESMO bloco firebaseConfig do seu index.html.
 *  Enquanto apiKey estiver como "SUA_API_KEY", o app roda em modo
 *  local (dados só nesta sessão) pra você testar.
 * ================================================================== */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "interliga-app.firebaseapp.com",
  projectId: "interliga-app",
  storageBucket: "interliga-app.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
const CONFIGURED = !firebaseConfig.apiKey.includes("SUA_API_KEY");

/* ---- Camada de dados: Firestore (online+offline) ou memória (demo) ---- */
function makeStore() {
  if (CONFIGURED) {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); // cache offline
    return {
      mode: "firestore",
      subscribe(coll, cb) {
        return db.collection(coll).onSnapshot(
          snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
          err => console.warn(coll, err)
        );
      },
      add: (coll, obj) => db.collection(coll).add(obj),
      remove: (coll, id) => db.collection(coll).doc(id).delete(),
    };
  }
  // fallback local
  const data = {}, subs = {};
  const emit = c => (subs[c] || []).forEach(fn => fn([...(data[c] || [])]));
  return {
    mode: "local",
    subscribe(coll, cb) { (subs[coll] ||= []).push(cb); cb([...(data[coll] || [])]); return () => {}; },
    add(coll, obj) { (data[coll] ||= []).push({ id: uid(), ...obj }); emit(coll); return Promise.resolve(); },
    remove(coll, id) { data[coll] = (data[coll] || []).filter(x => x.id !== id); emit(coll); return Promise.resolve(); },
  };
}
const store = makeStore();
const C_MEET = "agenda_reunioes";
const C_EVENT = "agenda_eventos";

/* ---------------------------- helpers ---------------------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const STAKEHOLDERS = [
  { id: 'vereador',   label: 'Vereador',   dot: 'bg-blue-500',    chip: 'bg-blue-50 text-blue-700 ring-blue-200' },
  { id: 'secretario', label: 'Secretário', dot: 'bg-violet-500',  chip: 'bg-violet-50 text-violet-700 ring-violet-200' },
  { id: 'comunidade', label: 'Comunidade', dot: 'bg-emerald-500', chip: 'bg-emerald-50 text-emerald-700 ring-emerald-200' },
  { id: 'lideranca',  label: 'Liderança',  dot: 'bg-amber-500',   chip: 'bg-amber-50 text-amber-700 ring-amber-200' },
];
const stk = id => STAKEHOLDERS.find(s => s.id === id) || STAKEHOLDERS[0];
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const fmtLongDate = iso => (iso ? new Date(iso + 'T00:00:00') : new Date())
  .toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };
const sortMeetings = (a, b) => (a.data + a.hora).localeCompare(b.data + b.hora);
function maskPhone(v) {
  const d = (v || '').replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d.length ? `(${d}` : '';
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
// monta número internacional para o wa.me (assume Brasil +55)
function waNumber(masked) {
  let d = (masked || '').replace(/\D/g, '');
  if (!d) return '';
  if (!d.startsWith('55')) d = '55' + d;
  return d;
}
function waLink(masked, texto) {
  const num = waNumber(masked);
  const base = num ? `https://wa.me/${num}` : 'https://wa.me/';
  return `${base}?text=${encodeURIComponent(texto)}`;
}

/* ---------------------------- ícones ---------------------------- */
const PATHS = {
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.98.36 1.94.7 2.86a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.22-1.22a2 2 0 0 1 2.11-.45c.92.34 1.88.57 2.86.7A2 2 0 0 1 22 16.92z"/>',
  trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  chevron: '<path d="M15 18l-6-6 6-6"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  sun: '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
};
const WA = '<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413"/>';
function Ic({ n, className = "w-5 h-5" }) {
  if (n === 'whatsapp')
    return <svg viewBox="0 0 24 24" className={className} fill="currentColor" dangerouslySetInnerHTML={{ __html: WA }} />;
  return <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2"
    strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: PATHS[n] || '' }} />;
}

/* ================================================================== */
function App() {
  const [view, setView] = useState('hoje');
  const [meetings, setMeetings] = useState([]);
  const [events, setEvents] = useState([]);
  const [ready, setReady] = useState(false);
  const [showMeetingForm, setShowMeetingForm] = useState(false);
  const [showEventForm, setShowEventForm] = useState(false);
  const [selectedEvent, setSelectedEvent] = useState(null);
  const [shareOpen, setShareOpen] = useState(false);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    const u1 = store.subscribe(C_MEET, list => { setMeetings(list); setReady(true); });
    const u2 = store.subscribe(C_EVENT, list => setEvents(list));
    return () => { u1 && u1(); u2 && u2(); };
  }, []);

  const addMeeting = d => store.add(C_MEET, d).then(() => setShowMeetingForm(false));
  const delMeeting = id => store.remove(C_MEET, id);
  const addEvent = e => store.add(C_EVENT, { createdAt: Date.now(), ...e }).then(() => setShowEventForm(false));
  const delEvent = id => store.remove(C_EVENT, id).then(() => setSelectedEvent(null));

  const today = todayISO();
  const todaysMeetings = meetings.filter(m => m.data === today).sort(sortMeetings);
  const orderedEvents = [...events].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  function pautaTexto() {
    const header = `📋 AGENDA — ${fmtLongDate(today)}\n${'─'.repeat(22)}`;
    if (!todaysMeetings.length) return `${header}\n\nSem reuniões agendadas para hoje.`;
    return header + todaysMeetings.map(m =>
      `\n\n🕐 ${m.hora} • ${stk(m.categoria).label}\nPauta: ${m.pauta || '—'}\nAgendado por: ${m.quemAgendou || '—'}`).join('');
  }
  async function copyPauta() {
    try { await navigator.clipboard.writeText(pautaTexto()); }
    catch { const t = document.createElement('textarea'); t.value = pautaTexto(); document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    setCopied(true); setTimeout(() => setCopied(false), 1600);
  }

  if (!ready) return (
    <div className="min-h-screen flex items-center justify-center text-slate-500">
      <div className="w-5 h-5 border-2 border-slate-300 border-t-slate-700 rounded-full animate-spin mr-3" />Carregando…
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col max-w-md mx-auto shadow-sm">
      <header className="bg-slate-900 text-white px-5 pt-6 pb-5 sticky top-0 z-20">
        <div className="flex items-start justify-between">
          <div>
            <p className="text-slate-300 text-sm">{greeting()},</p>
            <h1 className="text-xl font-semibold leading-tight">Agenda do Representante</h1>
            <p className="text-slate-400 text-xs mt-0.5 capitalize">{fmtLongDate(today)}</p>
          </div>
          <div className="relative">
            <Ic n="bell" className="w-6 h-6 text-slate-300" />
            {todaysMeetings.length > 0 &&
              <span className="absolute -top-1.5 -right-1.5 bg-amber-400 text-slate-900 text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">{todaysMeetings.length}</span>}
          </div>
        </div>
      </header>

      {store.mode === 'local' &&
        <div className="mx-4 mt-3 flex items-start gap-2 rounded-lg bg-amber-50 ring-1 ring-amber-200 px-3 py-2 text-xs text-amber-800">
          <Ic n="alert" className="w-4 h-4 mt-0.5 shrink-0" />
          <span>Modo local (demo). Cole seu <b>firebaseConfig</b> no topo do arquivo para sincronizar online/offline via Firestore.</span>
        </div>}

      <main className="flex-1 overflow-y-auto pb-24">
        {view === 'hoje' && <Dashboard meetings={todaysMeetings} eventsCount={events.length} totalMeetings={meetings.length} onShare={() => setShareOpen(true)} onDelete={delMeeting} />}
        {view === 'reunioes' && <MeetingsView meetings={meetings} onDelete={delMeeting} today={today} />}
        {view === 'eventos' && <EventsView events={orderedEvents} onOpen={setSelectedEvent} />}
      </main>

      <button onClick={() => view === 'eventos' ? setShowEventForm(true) : setShowMeetingForm(true)}
        className="fixed bottom-20 right-1/2 translate-x-[172px] z-30 bg-blue-600 active:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center">
        <Ic n="plus" className="w-7 h-7" />
      </button>

      <nav className="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white border-t border-slate-200 grid grid-cols-3 z-20">
        {[{ id:'hoje',label:'Hoje',icon:'home' },{ id:'reunioes',label:'Reuniões',icon:'calendar' },{ id:'eventos',label:'Eventos',icon:'camera' }].map(t => (
          <button key={t.id} onClick={() => setView(t.id)}
            className={`flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium ${view === t.id ? 'text-blue-600' : 'text-slate-400'}`}>
            <Ic n={t.icon} className="w-5 h-5" />{t.label}
          </button>
        ))}
      </nav>

      {showMeetingForm && <MeetingForm onClose={() => setShowMeetingForm(false)} onSave={addMeeting} today={today} />}
      {showEventForm && <EventForm onClose={() => setShowEventForm(false)} onSave={addEvent} />}
      {selectedEvent && <EventDetail event={selectedEvent} onClose={() => setSelectedEvent(null)} onDelete={delEvent} />}
      {shareOpen && <ShareModal texto={pautaTexto()} copied={copied} onCopy={copyPauta} onClose={() => setShareOpen(false)} />}
    </div>
  );
}

/* ---------------------------- Hoje ---------------------------- */
function Dashboard({ meetings, eventsCount, totalMeetings, onShare, onDelete }) {
  const now = new Date().toTimeString().slice(0, 5);
  const next = meetings.find(m => m.hora >= now) || meetings[0];
  const resumoDia = `📋 AGENDA — ${fmtLongDate(todayISO())}\n${'─'.repeat(22)}` +
    (meetings.length ? meetings.map(m => `\n\n🕐 ${m.hora} • ${stk(m.categoria).label}\nPauta: ${m.pauta || '—'}\nAgendado por: ${m.quemAgendou || '—'}`).join('')
      : '\n\nSem reuniões agendadas para hoje.');
  return (
    <div className="p-4 space-y-4">
      <div className="rounded-2xl bg-gradient-to-br from-blue-600 to-blue-700 text-white p-5">
        <div className="flex items-center gap-2 text-blue-100 text-sm mb-1"><Ic n="sun" className="w-4 h-4" /> Resumo do dia</div>
        <p className="text-3xl font-bold">{meetings.length}</p>
        <p className="text-blue-100 text-sm">{meetings.length === 0 ? 'nenhuma reunião hoje' : meetings.length === 1 ? 'reunião agendada' : 'reuniões agendadas'}</p>
        {next && <div className="mt-3 pt-3 border-t border-white/20 text-sm"><span className="text-blue-100">Próxima: </span><b>{next.hora}</b> — {stk(next.categoria).label}</div>}
        <div className="grid grid-cols-2 gap-2 mt-4">
          <button onClick={onShare} className="bg-white/15 active:bg-white/25 rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-1.5"><Ic n="file" className="w-4 h-4" /> Resumo</button>
          <a href={waLink('', resumoDia)} target="_blank"
            className="bg-emerald-500/90 active:bg-emerald-500 rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-1.5"><Ic n="whatsapp" className="w-4 h-4" /> WhatsApp</a>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Stat n="calendar" value={totalMeetings} label="Reuniões" tint="text-blue-600 bg-blue-50" />
        <Stat n="camera" value={eventsCount} label="Eventos" tint="text-emerald-600 bg-emerald-50" />
      </div>
      <div>
        <h2 className="text-sm font-semibold text-slate-500 uppercase tracking-wide px-1 mb-2">Compromissos de hoje</h2>
        {meetings.length === 0 ? <Empty n="calendar" text="Nenhuma reunião para hoje." />
          : <div className="space-y-2">{meetings.map(m => <MeetingCard key={m.id} m={m} onDelete={onDelete} />)}</div>}
      </div>
    </div>
  );
}
function Stat({ n, value, label, tint }) {
  return (
    <div className="rounded-2xl bg-white ring-1 ring-slate-200 p-4">
      <div className={`w-9 h-9 rounded-lg flex items-center justify-center mb-2 ${tint}`}><Ic n={n} /></div>
      <p className="text-2xl font-bold">{value}</p><p className="text-xs text-slate-500">{label}</p>
    </div>
  );
}

/* ---------------------------- Reuniões ---------------------------- */
function MeetingsView({ meetings, onDelete, today }) {
  const [filter, setFilter] = useState('todos');
  const list = meetings.filter(m => filter === 'todos' || m.categoria === filter).sort(sortMeetings);
  const groups = {}; list.forEach(m => (groups[m.data] ||= []).push(m));
  const dates = Object.keys(groups).sort();
  return (
    <div className="p-4">
      <div className="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1">
        <Chip active={filter === 'todos'} onClick={() => setFilter('todos')} label="Todos" />
        {STAKEHOLDERS.map(s => <Chip key={s.id} active={filter === s.id} onClick={() => setFilter(s.id)} label={s.label} dot={s.dot} />)}
      </div>
      {dates.length === 0 ? <Empty n="calendar" text="Nenhuma reunião cadastrada." />
        : dates.map(d => (
          <div key={d} className="mb-5">
            <span className={`text-xs font-semibold uppercase tracking-wide px-1 ${d === today ? 'text-blue-600' : 'text-slate-400'}`}>{d === today ? 'Hoje • ' : ''}{fmtLongDate(d)}</span>
            <div className="space-y-2 mt-2">{groups[d].map(m => <MeetingCard key={m.id} m={m} onDelete={onDelete} />)}</div>
          </div>
        ))}
    </div>
  );
}
function Chip({ active, onClick, label, dot }) {
  return <button onClick={onClick} className={`shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium ring-1 ${active ? 'bg-slate-900 text-white ring-slate-900' : 'bg-white text-slate-600 ring-slate-200'}`}>{dot && <span className={`w-2 h-2 rounded-full ${dot}`} />}{label}</button>;
}
function MeetingCard({ m, onDelete }) {
  const s = stk(m.categoria); const [c, setC] = useState(false);
  return (
    <div className="rounded-xl bg-white ring-1 ring-slate-200 p-3.5 flex gap-3">
      <div className="flex flex-col items-center justify-center px-2 border-r border-slate-100">
        <span className="text-lg font-bold leading-none">{m.hora}</span><Ic n="clock" className="w-3.5 h-3.5 text-slate-300 mt-1" />
      </div>
      <div className="flex-1 min-w-0">
        <span className={`inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full ring-1 ${s.chip}`}><span className={`w-1.5 h-1.5 rounded-full ${s.dot}`} />{s.label}</span>
        <p className="text-sm font-medium leading-snug break-words mt-1">{m.pauta || 'Sem pauta'}</p>
        {m.quemAgendou && <p className="text-xs text-slate-400 mt-1 flex items-center gap-1"><Ic n="users" className="w-3 h-3" />{m.quemAgendou}</p>}
      </div>
      {c ? <div className="flex flex-col gap-1"><button onClick={() => onDelete(m.id)} className="text-xs bg-rose-500 text-white px-2 py-1 rounded">Excluir</button><button onClick={() => setC(false)} className="text-xs text-slate-400">Cancelar</button></div>
        : <button onClick={() => setC(true)} className="text-slate-300 self-start p-1"><Ic n="trash" className="w-4 h-4" /></button>}
    </div>
  );
}

/* ---------------------------- Eventos ---------------------------- */
function EventsView({ events, onOpen }) {
  if (!events.length) return <div className="p-4"><Empty n="camera" text="Nenhum evento cadastrado ainda." /></div>;
  return (
    <div className="p-4 space-y-2">
      {events.map(ev => (
        <button key={ev.id} onClick={() => onOpen(ev)} className="w-full text-left rounded-xl bg-white ring-1 ring-slate-200 p-3.5 flex items-center gap-3">
          <div className="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><Ic n="camera" /></div>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-semibold leading-tight truncate">{ev.nome}</p>
            {ev.contatoNome && <p className="text-xs text-slate-400 truncate">{ev.contatoNome}{ev.whatsapp ? ` • ${ev.whatsapp}` : ''}</p>}
          </div>
          <Ic n="chevron" className="w-4 h-4 text-slate-300 rotate-180" />
        </button>
      ))}
    </div>
  );
}
function EventDetail({ event, onClose, onDelete }) {
  const [c, setC] = useState(false);
  const texto = `*${event.nome}*` +
    (event.descricao ? `\n${event.descricao}` : '') +
    (event.contatoNome || event.contatoTelefone ? `\n\nContato: ${event.contatoNome || ''} ${event.contatoTelefone || ''}`.trimEnd() : '') +
    (event.instagram ? `\nInstagram: ${event.instagram}` : '') +
    (event.facebook ? `\nFacebook: ${event.facebook}` : '');

  function enviarTexto() { window.open(waLink(event.whatsapp, texto), '_blank'); }
  async function enviarFotos(e) {
    const files = Array.from(e.target.files || []); e.target.value = '';
    if (!files.length) return;
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files, text: texto, title: event.nome }); } catch (_) {}
    } else {
      alert('Para enviar as imagens, abra esta página no celular — o compartilhamento nativo permite escolher o WhatsApp. Pelo link do WhatsApp não é possível anexar imagens.');
    }
  }
  return (
    <Sheet title="Evento" onClose={onClose}>
      <div className="space-y-4">
        <h3 className="text-lg font-bold">{event.nome}</h3>
        {(event.contatoNome || event.contatoTelefone) &&
          <div className="rounded-xl bg-slate-50 p-3 text-sm space-y-1.5">
            {event.contatoNome && <p className="flex items-center gap-2"><Ic n="users" className="w-4 h-4 text-slate-400" />{event.contatoNome}</p>}
            {event.contatoTelefone && <a href={`tel:${event.contatoTelefone.replace(/\D/g,'')}`} className="flex items-center gap-2 text-blue-600 font-medium"><Ic n="phone" className="w-4 h-4" />{event.contatoTelefone}</a>}
          </div>}
        {event.descricao && <div><p className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Descrição</p><p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{event.descricao}</p></div>}
        {(event.instagram || event.facebook) &&
          <div className="text-sm space-y-1">
            {event.instagram && <a href={event.instagram} target="_blank" className="text-pink-600 block truncate">Instagram: {event.instagram}</a>}
            {event.facebook && <a href={event.facebook} target="_blank" className="text-blue-600 block truncate">Facebook: {event.facebook}</a>}
          </div>}

        <div className="space-y-2 pt-1">
          <button onClick={enviarTexto} className="w-full bg-emerald-600 active:bg-emerald-700 text-white rounded-lg py-3 font-medium flex items-center justify-center gap-2">
            <Ic n="whatsapp" className="w-5 h-5" /> Enviar no WhatsApp{event.whatsapp ? '' : ' (escolher contato)'}
          </button>
          <label className="w-full bg-white ring-1 ring-emerald-300 text-emerald-700 rounded-lg py-3 font-medium flex items-center justify-center gap-2 cursor-pointer">
            <Ic n="image" className="w-5 h-5" /> Selecionar e enviar fotos
            <input type="file" accept="image/*" multiple onChange={enviarFotos} className="hidden" />
          </label>
        </div>

        {c ? <div className="flex gap-2 pt-2"><button onClick={() => onDelete(event.id)} className="flex-1 bg-rose-500 text-white rounded-lg py-2.5 text-sm font-medium">Confirmar exclusão</button><button onClick={() => setC(false)} className="px-4 text-slate-500 text-sm">Cancelar</button></div>
          : <button onClick={() => setC(true)} className="w-full text-rose-500 text-sm font-medium py-2 flex items-center justify-center gap-2"><Ic n="trash" className="w-4 h-4" /> Excluir evento</button>}
      </div>
    </Sheet>
  );
}

/* ---------------------------- Formulários ---------------------------- */
const inputCls = "w-full rounded-lg ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 outline-none px-3 py-2.5 text-sm bg-white";
function Field({ label, children }) { return <div><label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{label}</label>{children}</div>; }

function MeetingForm({ onClose, onSave, today }) {
  const [data, setData] = useState(today), [hora, setHora] = useState('09:00');
  const [pauta, setPauta] = useState(''), [quem, setQuem] = useState(''), [cat, setCat] = useState('vereador');
  return (
    <Sheet title="Nova reunião" onClose={onClose}>
      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <Field label="Data"><input type="date" value={data} onChange={e => setData(e.target.value)} className={inputCls} /></Field>
          <Field label="Hora"><input type="time" value={hora} onChange={e => setHora(e.target.value)} className={inputCls} /></Field>
        </div>
        <Field label="Pauta"><textarea value={pauta} onChange={e => setPauta(e.target.value)} rows={3} placeholder="Assuntos a discutir…" className={inputCls} /></Field>
        <Field label="Quem agendou"><input value={quem} onChange={e => setQuem(e.target.value)} placeholder="Nome do solicitante" className={inputCls} /></Field>
        <Field label="Categoria do stakeholder">
          <div className="grid grid-cols-2 gap-2">
            {STAKEHOLDERS.map(s => <button key={s.id} onClick={() => setCat(s.id)} className={`flex items-center gap-2 rounded-lg px-3 py-2.5 text-sm font-medium ring-1 ${cat === s.id ? 'ring-slate-900 bg-slate-900 text-white' : 'ring-slate-200 bg-white text-slate-600'}`}><span className={`w-2.5 h-2.5 rounded-full ${s.dot}`} />{s.label}</button>)}
          </div>
        </Field>
        <button disabled={!data || !hora} onClick={() => onSave({ data, hora, pauta, quemAgendou: quem, categoria: cat })} className="w-full bg-blue-600 disabled:bg-slate-300 active:bg-blue-700 text-white rounded-lg py-3 font-medium flex items-center justify-center gap-2"><Ic n="check" className="w-5 h-5" /> Salvar reunião</button>
      </div>
    </Sheet>
  );
}
function EventForm({ onClose, onSave }) {
  const [nome, setNome] = useState(''), [cNome, setCNome] = useState(''), [cTel, setCTel] = useState('');
  const [wpp, setWpp] = useState(''), [ig, setIg] = useState(''), [fb, setFb] = useState(''), [desc, setDesc] = useState('');
  return (
    <Sheet title="Novo evento" onClose={onClose}>
      <div className="space-y-4">
        <Field label="Nome do evento"><input value={nome} onChange={e => setNome(e.target.value)} placeholder="Ex.: Inauguração da praça" className={inputCls} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Contato — nome"><input value={cNome} onChange={e => setCNome(e.target.value)} placeholder="Nome" className={inputCls} /></Field>
          <Field label="Telefone"><input value={cTel} onChange={e => setCTel(maskPhone(e.target.value))} inputMode="numeric" placeholder="(71) 90000-0000" className={inputCls} /></Field>
        </div>
        <Field label="WhatsApp para envio">
          <div className="flex items-center gap-2 rounded-lg ring-1 ring-slate-200 px-3">
            <Ic n="whatsapp" className="w-4 h-4 text-emerald-600 shrink-0" />
            <input value={wpp} onChange={e => setWpp(maskPhone(e.target.value))} inputMode="numeric" placeholder="(71) 90000-0000" className="flex-1 py-2.5 text-sm outline-none bg-transparent" />
          </div>
        </Field>
        <Field label="Redes sociais">
          <div className="space-y-2">
            <input value={ig} onChange={e => setIg(e.target.value)} placeholder="Link do Instagram" className={inputCls} />
            <input value={fb} onChange={e => setFb(e.target.value)} placeholder="Link do Facebook" className={inputCls} />
          </div>
        </Field>
        <Field label="Descrição / relatório"><textarea value={desc} onChange={e => setDesc(e.target.value)} rows={4} placeholder="Observações, relatório…" className={inputCls} /></Field>
        <p className="text-xs text-slate-400 flex items-center gap-1.5"><Ic n="image" className="w-3.5 h-3.5" /> As fotos você seleciona na hora de enviar (não ficam salvas).</p>
        <button disabled={!nome.trim()} onClick={() => onSave({ nome: nome.trim(), contatoNome: cNome, contatoTelefone: cTel, whatsapp: wpp, instagram: ig, facebook: fb, descricao: desc })} className="w-full bg-emerald-600 disabled:bg-slate-300 active:bg-emerald-700 text-white rounded-lg py-3 font-medium flex items-center justify-center gap-2"><Ic n="check" className="w-5 h-5" /> Salvar evento</button>
      </div>
    </Sheet>
  );
}

/* ---------------------------- Resumo / util UI ---------------------------- */
function ShareModal({ texto, copied, onCopy, onClose }) {
  return (
    <Sheet title="Resumo da pauta" onClose={onClose}>
      <div className="space-y-4">
        <div className="rounded-xl bg-slate-900 text-slate-100 p-4 text-sm font-mono whitespace-pre-wrap leading-relaxed max-h-72 overflow-y-auto">{texto}</div>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={onCopy} className="bg-slate-200 active:bg-slate-300 rounded-lg py-3 font-medium flex items-center justify-center gap-2">{copied ? <><Ic n="check" className="w-5 h-5" />Copiado</> : <><Ic n="file" className="w-5 h-5" />Copiar</>}</button>
          <a href={waLink('', texto)} target="_blank" className="bg-emerald-600 text-white rounded-lg py-3 font-medium flex items-center justify-center gap-2"><Ic n="whatsapp" className="w-5 h-5" />WhatsApp</a>
        </div>
      </div>
    </Sheet>
  );
}
function Empty({ n, text }) { return <div className="flex flex-col items-center justify-center py-14 text-slate-300"><Ic n={n} className="w-12 h-12 mb-3" /><p className="text-sm text-slate-400">{text}</p></div>; }
function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center">
      <div className="absolute inset-0 bg-black/40" onClick={onClose} />
      <div className="relative w-full max-w-md bg-white rounded-t-3xl max-h-[92vh] overflow-y-auto">
        <div className="sticky top-0 bg-white/95 backdrop-blur px-5 py-4 flex items-center justify-between border-b border-slate-100 z-10">
          <div className="flex items-center gap-2"><button onClick={onClose} className="text-slate-400"><Ic n="chevron" className="w-5 h-5" /></button><h2 className="font-semibold">{title}</h2></div>
          <button onClick={onClose} className="text-slate-400"><Ic n="x" className="w-5 h-5" /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
