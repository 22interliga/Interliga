<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Interliga — Diagnóstico TESTE</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#24124d;border:1px solid #6d28d9;border-radius:14px;padding:16px;margin-bottom:14px}.card{background:#111827;border:1px solid #374151;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{background:#1f2937;border-radius:10px;padding:12px}.box small{display:block;color:#9ca3af;margin-bottom:5px}.ok{color:#86efac}.warn{color:#fde68a}.bad{color:#fca5a5}input,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #4b5563;background:#111827;color:white;font-size:15px}button{background:#7c3aed;border:0;font-weight:800;cursor:pointer}.tbl{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px;border-bottom:1px solid #374151;font-size:13px}th{color:#9ca3af}.msg{margin-top:10px;color:#c4b5fd}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><b>🧪 DIAGNÓSTICO DE CHAMADAS — SOMENTE LEITURA</b><div style="margin-top:5px;color:#ddd6fe;font-size:13px">Não altera corridas, motoristas ou produção.</div></div><div class="card" id="login"><h3>Entrar</h3><div class="grid"><div><small>E-mail Admin</small><input id="email" type="email"></div><div><small>Senha</small><input id="senha" type="password"></div></div><button id="entrar" style="margin-top:10px">Entrar</button><div id="loginmsg" class="msg"></div></div><div id="painel" hidden><div class="card"><button id="atualizar">🔄 Atualizar diagnóstico</button><div id="hora" class="msg"></div></div><div class="card"><h3>Última corrida aguardando</h3><div id="corrida" class="grid"></div></div><div class="card"><h3>Motoristas disponíveis agora</h3><div class="tbl"><table><thead><tr><th>UID</th><th>Nome</th><th>Cidade</th><th>Categoria(s)</th><th>Atualização</th><th>Está na fila?</th></tr></thead><tbody id="motoristas"></tbody></table></div></div><div class="card"><h3>Conclusão automática</h3><div id="conclusao"></div></div></div></div><script type="module">import{carregarFirebase}from'../firebase-config.js';const f=await carregarFirebase('interliga-diagnostico-teste');const{db,auth,fb,authMod}=f;const $=id=>document.getElementById(id);function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tempo(ts){if(!ts)return'—';let ms=ts?.toMillis?ts.toMillis():Date.parse(ts);if(!Number.isFinite(ms))return'—';let s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?s+'s atrás':Math.round(s/60)+' min atrás'}async function atualizar(){try{$('hora').textContent='Consultando Firebase...';const [cs,ms]=await Promise.all([fb.getDocs(fb.query(fb.collection(db,'corridas'),fb.where('status','==','aguardando'))),fb.getDocs(fb.collection(db,'motoristas_disponiveis'))]);let corridas=cs.docs.map(d=>({id:d.id,...d.data()}));corridas.sort((a,b)=>{const ta=a.criadoEm?.toMillis?a.criadoEm.toMillis():Date.parse(a.criadoEm||0);const tb=b.criadoEm?.toMillis?b.criadoEm.toMillis():Date.parse(b.criadoEm||0);return tb-ta});const c=corridas[0]||null;const fila=Array.isArray(c?.filaMotoristas)?c.filaMotoristas:[];$('corrida').innerHTML=c?`<div class="box"><small>ID</small>${esc(c.id)}</div><div class="box"><small>Status</small>${esc(c.status)}</div><div class="box"><small>Cidade</small>${esc(c.cidade)}</div><div class="box"><small>Categoria</small>${esc(c.categoria)}</div><div class="box"><small>Criada</small>${esc(tempo(c.criadoEm))}</div><div class="box"><small>Motorista alvo atual</small>${esc(c.motoristaAlvoAtual||'MODO ABERTO')}</div><div class="box"><small>Tamanho da fila</small>${fila.length}</div><div class="box"><small>Fila</small>${esc(fila.join(' → ')||'Sem fila')}</div>`:'<div class="warn">Nenhuma corrida com status aguardando encontrada.</div>';let rows='';const motoristas=[];ms.forEach(d=>{const x={id:d.id,...d.data()};motoristas.push(x);const cats=Array.isArray(x.categorias)?x.categorias.join(', '):(x.categoria||'—');rows+=`<tr><td>${esc(d.id)}</td><td>${esc(x.nome)}</td><td>${esc(x.cidade)}</td><td>${esc(cats)}</td><td>${esc(tempo(x.atualizadoEm))}</td><td>${fila.includes(d.id)?'✅ SIM':'—'}</td></tr>`});$('motoristas').innerHTML=rows||'<tr><td colspan="6" class="bad">Nenhum motorista publicado em motoristas_disponiveis.</td></tr>';let conclusao=[];if(!c)conclusao.push('🔴 Não existe corrida aguardando no Firebase neste momento.');else{if(!motoristas.length)conclusao.push('🔴 Não há motorista disponível publicado no Firebase. O app Motorista pode estar Online visualmente, mas não está registrando disponibilidade.');if(c.motoristaAlvoAtual){const alvo=motoristas.find(m=>m.id===c.motoristaAlvoAtual);if(!alvo)conclusao.push('🔴 A corrida aponta para um motorista que não está mais na lista de disponíveis.');else conclusao.push('🟢 Existe um motorista alvo atual publicado como disponível: '+alvo.id);}else conclusao.push('🟡 A corrida está em modo aberto; qualquer motorista Online deveria enxergá-la.');const compat=motoristas.filter(m=>{const cats=Array.isArray(m.categorias)?m.categorias:(m.categoria?[m.categoria]:[]);return(!c.cidade||!m.cidade||m.cidade===c.cidade)&&(!c.categoria||!cats.length||cats.includes(c.categoria))});if(!compat.length)conclusao.push('🔴 Nenhum motorista disponível combina simultaneamente com cidade e categoria da corrida.');else conclusao.push('🟢 '+compat.length+' motorista(s) disponível(is) compatível(is) com cidade/categoria.')} $('conclusao').innerHTML=conclusao.map(x=>`<div style="padding:7px 0">${esc(x)}</div>`).join('');$('hora').textContent='Atualizado agora.'}catch(e){$('conclusao').innerHTML='<div class="bad">Erro ao consultar: '+esc(e.message)+'</div>';$('hora').textContent='Falha no diagnóstico.'}}$('entrar').onclick=async()=>{try{await authMod.signInWithEmailAndPassword(auth,$('email').value.trim(),$('senha').value);$('loginmsg').textContent='Login realizado.'}catch(e){$('loginmsg').textContent='Erro: '+e.message}};authMod.onAuthStateChanged(auth,u=>{if(!u)return;$('login').hidden=true;$('painel').hidden=false;atualizar()});$('atualizar').onclick=atualizar;</script></body></html>
