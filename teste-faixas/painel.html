<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Interliga — Painel TESTE Faixas KM</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}.top{background:#111827;color:#fff;padding:16px}.top b{color:#fbbf24}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}input,select,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}button{background:#ff6b00;color:#fff;border:0;font-weight:700;cursor:pointer}.sec{background:#111827}.danger{background:#b91c1c}.faixa{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}.faixa button{width:auto;padding:11px 14px}.msg{padding:10px;border-radius:8px;margin-top:10px;background:#f3f4f6}.ok{color:#15803d}.erro{color:#b91c1c}.nota{font-size:13px;color:#6b7280}@media(max-width:650px){.grid{grid-template-columns:1fr}.faixa{grid-template-columns:1fr 1fr}.faixa button{grid-column:1/-1;width:100%}}</style></head><body><div class="top"><b>🧪 AMBIENTE DE TESTE</b> — Faixas por KM. Não grava nos preços de produção.</div><div class="wrap">
<div class="card" id="login"><h2>Entrar no painel de teste</h2><div class="grid"><div><label>E-mail Admin</label><input id="email" type="email"></div><div><label>Senha</label><input id="senha" type="password"></div></div><button id="entrar" style="margin-top:12px">Entrar</button><div id="loginmsg" class="msg">Use seu acesso normal de administrador.</div></div>
<div id="editor" hidden><div class="card"><h2>Precificação de teste</h2><div class="grid"><div><label>Cidade</label><select id="cidade"><option value="madre">Madre de Deus</option><option value="sfc">São Francisco do Conde</option><option value="candeias">Candeias</option><option value="simoes">Simões Filho</option></select></div><div><label>Categoria</label><select id="categoria"></select></div><div><label>Preço mínimo (R$)</label><input id="minimo" type="number" step="0.01"></div><div><label>Tarifa por KM fallback (R$)</label><input id="tarifa" type="number" step="0.01"></div><div><label>Bandeirada fallback (R$)</label><input id="bandeirada" type="number" step="0.01"></div><div><label>Multiplicador</label><input id="multiplicador" type="number" step="0.01" value="1"></div></div><p class="nota">As faixas têm prioridade. Em cada faixa você pode definir um valor fixo e também um valor por KM.</p></div>
<div class="card"><h3>Faixas de KM</h3><div id="faixas"></div><button id="add" class="sec">+ Adicionar faixa</button></div><div class="card"><button id="salvar">Salvar configuração de TESTE</button><div id="msg" class="msg">Aguardando.</div></div></div></div>
<script type="module">import {carregarFirebase} from '../firebase-config.js';const f=await carregarFirebase('interliga-admin-teste-faixas');const {db,auth,fb,authMod}=f;const $=id=>document.getElementById(id);let tabela={},cats=[];function n(v){const x=Number(v);return Number.isFinite(x)?x:0}function addFaixa(v={de:0,ate:0,valor:0,valorKm:0}){const d=document.createElement('div');d.className='faixa';d.innerHTML=`<div><label>De km</label><input class="de" type="number" step="0.1" value="${v.de??0}"></div><div><label>Até km</label><input class="ate" type="number" step="0.1" value="${v.ate??0}"></div><div><label>Valor fixo R$</label><input class="valor" type="number" step="0.01" value="${v.valor??0}"></div><div><label>Valor por KM R$</label><input class="valorKm" type="number" step="0.01" value="${v.valorKm??0}"></div><button class="danger" type="button">Remover</button>`;d.querySelector('button').onclick=()=>d.remove();$('faixas').appendChild(d)}function lerFaixas(){return [...document.querySelectorAll('.faixa')].map(d=>({de:n(d.querySelector('.de').value),ate:n(d.querySelector('.ate').value),valor:n(d.querySelector('.valor').value),valorKm:n(d.querySelector('.valorKm').value)})).filter(x=>x.ate>=x.de).sort((a,b)=>a.de-b.de)}async function carregarCats(){const s=await fb.getDocs(fb.collection(db,'categorias_veiculo'));cats=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.ativo!==false);$('categoria').innerHTML=cats.map(c=>`<option value="${c.codigo||c.id}">${c.nome||c.codigo||c.id}</option>`).join('')}async function carregar(){const id='teste_'+$('cidade').value;const s=await fb.getDoc(fb.doc(db,'precos',id));tabela=s.exists()?s.data():{};const c=$('categoria').value;const geral=cats.find(x=>(x.codigo||x.id)===c)||{};const t=tabela[c]||{};$('minimo').value=t.minimo??geral.minimo??geral.precoMinimo??0;$('tarifa').value=t.tarifaKm??geral.tarifaKm??geral.tarifakm??0;$('bandeirada').value=t.bandeirada??geral.bandeirada??0;$('multiplicador').value=t.multiplicador??geral.multiplicador??1;$('faixas').innerHTML='';(Array.isArray(t.faixasKm)?t.faixasKm:[]).forEach(addFaixa);if(!$('faixas').children.length)addFaixa();$('msg').textContent='Configuração de teste carregada: precos/'+id}async function salvar(){const c=$('categoria').value,id='teste_'+$('cidade').value;const dados={...tabela,[c]:{...(tabela[c]||{}),nome:cats.find(x=>(x.codigo||x.id)===c)?.nome||c,ativo:true,minimo:n($('minimo').value),tarifaKm:n($('tarifa').value),bandeirada:n($('bandeirada').value),multiplicador:n($('multiplicador').value)||1,faixasKm:lerFaixas()}};try{await fb.setDoc(fb.doc(db,'precos',id),dados);tabela=dados;$('msg').innerHTML='<span class="ok">✓ Salvo somente no ambiente de teste: precos/'+id+'</span>'}catch(e){$('msg').innerHTML='<span class="erro">Erro ao salvar: '+e.message+'</span>'}}$('entrar').onclick=async()=>{try{await authMod.signInWithEmailAndPassword(auth,$('email').value.trim(),$('senha').value);$('loginmsg').textContent='Login realizado.'}catch(e){$('loginmsg').innerHTML='<span class="erro">Falha no login: '+e.message+'</span>'}};authMod.onAuthStateChanged(auth,async u=>{if(!u)return;$('login').hidden=true;$('editor').hidden=false;try{await carregarCats();await carregar()}catch(e){$('msg').innerHTML='<span class="erro">Erro: '+e.message+'</span>'}});$('cidade').onchange=carregar;$('categoria').onchange=carregar;$('add').onclick=()=>addFaixa();$('salvar').onclick=salvar;</script></body></html>
