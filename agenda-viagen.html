<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1420">
<title>22 Mobilidade · Agenda & Financeiro</title>
<style>
  :root{
    --bg:#0E1420; --panel:#161E2E; --panel-2:#1E2839; --line:#26324A;
    --ink:#E7ECF3; --muted:#8A97AD; --faint:#5C6A82;
    --blue:#3B6EF6; --blue-dim:#22335c;
    --amber:#F5A524; --green:#16B364; --pago:#4C9AFF; --red:#F5555D;
    --radius:16px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
  body{padding-bottom:88px;padding-top:env(safe-area-inset-top)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit}
  h1,h2,h3{margin:0}
  ::-webkit-scrollbar{width:0;height:0}

  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0E1420,#0E1420f2);
    padding:16px 16px 12px;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .topbar-row{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;
    font-weight:800;font-style:italic;letter-spacing:-1px;font-size:15px;color:#fff;box-shadow:0 4px 14px #3b6ef655}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .brand strong{font-size:16px;letter-spacing:-.3px}
  .bell{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
    display:grid;place-items:center;font-size:17px;position:relative}
  .bell.on{border-color:var(--green);color:var(--green)}
  .bell .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);display:none}
  .bell.off .dot{display:block}

  main{padding:14px 16px 16px}
  .view{display:none;animation:fade .25s ease} .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .strip{display:flex;gap:10px;margin-bottom:6px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
  .stat .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .stat .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px}
  .stat.up .v{color:var(--green)} .stat.down .v{color:var(--red)}

  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
  .sec-h h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
  .card:active{background:var(--panel-2)}
  .card .light{position:absolute;left:0;top:0;bottom:0;width:4px}
  .card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-left:6px}
  .cli{font-weight:700;font-size:16px;letter-spacing:-.2px}
  .cat-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:3px}
  .cat-dot{width:8px;height:8px;border-radius:50%}
  .rail{display:flex;align-items:center;gap:8px;margin:12px 0 10px 6px;font-family:var(--mono);font-size:13px}
  .rail .arr{color:var(--faint)} .rail .time{color:var(--blue);font-weight:600}
  .route{margin:2px 0 0 6px;color:var(--muted);font-size:13px;line-height:1.5}
  .route b{color:var(--ink);font-weight:600}
  .meta{display:flex;flex-wrap:wrap;gap:14px;margin:11px 0 0 6px;font-size:12px;color:var(--muted)}
  .meta .mono{font-family:var(--mono)}
  .card .foot{display:flex;justify-content:space-between;align-items:center;margin:12px 6px 0;
    padding-top:11px;border-top:1px solid var(--line)}
  .total{font-family:var(--mono);font-size:19px;font-weight:600}
  .pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;letter-spacing:.04em;
    display:inline-flex;align-items:center;gap:6px}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .pill.aberto{background:#3a2b0e;color:var(--amber)} .pill.aberto .d{background:var(--amber)}
  .pill.pago{background:#12294d;color:var(--pago)} .pill.pago .d{background:var(--pago)}
  .pill.quitado{background:#0e2e1f;color:var(--green)} .pill.quitado .d{background:var(--green)}
  .daylabel{font-family:var(--mono);font-size:12px;color:var(--faint);margin:16px 2px 8px;
    text-transform:uppercase;letter-spacing:.08em}
  .daylabel.today{color:var(--blue)}
  .notif-tag{font-size:10px;color:var(--faint);margin-left:6px}

  .empty{text-align:center;color:var(--muted);padding:44px 20px;border:1px dashed var(--line);border-radius:var(--radius)}
  .empty .big{font-size:30px;margin-bottom:8px}
  .empty b{color:var(--ink)}

  /* month nav + financeiro */
  .monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:6px 6px;margin-bottom:12px}
  .monthnav button{width:40px;height:36px;border-radius:10px;background:transparent;font-size:20px;color:var(--muted)}
  .monthnav .lbl{font-weight:700;font-size:15px;text-transform:capitalize}
  .fin-tot{display:flex;gap:10px;margin-bottom:12px}
  .fin-tot .stat{cursor:default}
  .fin-tot .stat.saldo .v.neg{color:var(--red)} .fin-tot .stat.saldo .v.pos{color:var(--green)}
  .fin-actions{display:flex;gap:10px;margin-bottom:8px}
  .fin-actions button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;font-weight:700;font-size:13px;color:var(--ink)}
  .fin-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg2{display:flex;gap:8px;margin:14px 0 12px}
  .seg2 button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;
    font-weight:700;font-size:14px;color:var(--muted)}
  .seg2 button.sel.saida{color:var(--red);border-color:var(--red)}
  .seg2 button.sel.entrada{color:var(--green);border-color:var(--green)}

  .brk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
  .brk .top{display:flex;align-items:center;gap:11px}
  .brk .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
  .brk .nm{flex:1;font-weight:600;font-size:15px}
  .brk .pct{font-family:var(--mono);color:var(--muted);font-size:12px;margin-right:8px}
  .brk .val{font-family:var(--mono);font-weight:600;font-size:15px}
  .brk .bar{height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
  .brk .bar i{display:block;height:100%;border-radius:3px}

  .lanc{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .lanc .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .lanc .info{flex:1;min-width:0}
  .lanc .info .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lanc .info .s{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
  .lanc .amt{font-family:var(--mono);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
  .lanc .amt.entrada{color:var(--green)} .lanc .amt.saida{color:var(--red)}

  /* form */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    border-radius:11px;padding:12px;color:var(--ink);font-size:15px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3b6ef633}
  .field input.mono{font-family:var(--mono)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .calc{background:var(--blue-dim);border:1px solid #35528f;border-radius:12px;padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}
  .calc .k{color:#a9c0ff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .calc .v{font-family:var(--mono);font-size:22px;font-weight:600;color:#fff}

  .seg{display:flex;gap:8px}
  .seg button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 6px;
    font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px}
  .seg button .d{width:9px;height:9px;border-radius:50%;background:var(--faint)}
  .seg button.sel{color:var(--ink);border-color:currentColor}
  .seg button.sel.aberto{color:var(--amber)} .seg button.sel.aberto .d{background:var(--amber)}
  .seg button.sel.pago{color:var(--pago)} .seg button.sel.pago .d{background:var(--pago)}
  .seg button.sel.quitado{color:var(--green)} .seg button.sel.quitado .d{background:var(--green)}
  .seg button.sel.entrada{color:var(--green)} .seg button.sel.entrada .d{background:var(--green)}
  .seg button.sel.saida{color:var(--red)} .seg button.sel.saida .d{background:var(--red)}

  .switch-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on{background:var(--green)} .sw.on::after{left:22px}

  .btn{width:100%;background:var(--blue);border-radius:12px;padding:15px;font-size:16px;font-weight:700;
    color:#fff;margin-top:6px;box-shadow:0 6px 18px #3b6ef644}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);box-shadow:none}
  .btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);box-shadow:none;margin-top:12px}

  .cat-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px;margin-bottom:10px}
  .cat-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
  .cat-item .nm{flex:1;font-weight:600}
  .cat-item .ed{color:var(--muted);font-size:20px;padding:6px 8px;background:none}
  .icogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}
  .icogrid button{aspect-ratio:1;font-size:22px;background:var(--bg);border:1px solid var(--line);border-radius:11px}
  .icogrid button.sel{border-color:var(--blue);background:var(--blue-dim)}
  .colgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .colgrid button{aspect-ratio:1;border-radius:50%;border:2px solid transparent}
  .colgrid button.sel{border-color:#fff;transform:scale(1.12)}

  .filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
  .chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .quick{display:flex;gap:8px;margin:10px 6px 0}
  .quick button{flex:1;font-size:12px;font-weight:700;padding:9px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .quick button.go-pago{color:var(--pago)} .quick button.go-quit{color:var(--green)}

  /* import */
  .imp-map{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
  .imp-map .field{margin:0}
  .prev{border:1px solid var(--line);border-radius:12px;overflow:auto;margin:6px 0 4px;max-height:230px}
  table.pv{border-collapse:collapse;width:100%;font-size:12px}
  table.pv th,table.pv td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
  table.pv th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--panel-2)}
  table.pv td.v{font-family:var(--mono)}
  table.pv td.e{color:var(--green)} table.pv td.s{color:var(--red)}
  .imp-sum{font-size:13px;color:var(--muted);margin:8px 2px;font-family:var(--mono)}
  .radios{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .radios button{flex:1;min-width:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px;font-weight:600;color:var(--muted)}
  .radios button.sel{color:var(--ink);border-color:var(--blue)}

  .fab{position:fixed;right:18px;bottom:96px;z-index:25;width:56px;height:56px;border-radius:18px;
    background:var(--blue);color:#fff;font-size:28px;display:none;place-items:center;box-shadow:0 8px 22px #3b6ef666}
  .fab.show{display:grid}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0E1420f2;backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--faint);font-size:10px;font-weight:700;padding:6px 0}
  .nav button .i{font-size:20px;line-height:1}
  .nav button.sel{color:var(--blue)}

  .scrim{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:flex-end}
  .scrim.on{display:flex}
  .sheet{width:100%;background:var(--panel);border-radius:20px 20px 0 0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
    border-top:1px solid var(--line);animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:17px;margin-bottom:16px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;z-index:60;background:var(--ink);
    color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;
    transition:.25s;box-shadow:0 8px 24px #0008;max-width:88%;text-align:center}
  .toast.on{opacity:1;bottom:112px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="logo">22</div>
      <div><small>22 Mobilidade</small><strong id="brand-title">Agenda de Viagens</strong></div>
    </div>
    <button class="bell off" id="bell" title="Notificações">🔔<span class="dot"></span></button>
  </div>
</header>

<main>
  <!-- AGENDA -->
  <section class="view active" id="v-agenda">
    <div class="strip" id="strip"></div>
    <div id="agenda-list"></div>
  </section>

  <!-- FINANCEIRO -->
  <section class="view" id="v-fin">
    <div class="monthnav">
      <button id="m-prev">‹</button>
      <span class="lbl" id="m-lbl"></span>
      <button id="m-next">›</button>
    </div>
    <div class="fin-tot">
      <div class="stat up"><div class="k">Entradas</div><div class="v" id="t-ent">R$ 0</div></div>
      <div class="stat down"><div class="k">Saídas</div><div class="v" id="t-sai">R$ 0</div></div>
      <div class="stat saldo"><div class="k">Saldo</div><div class="v" id="t-sal">R$ 0</div></div>
    </div>
    <div class="fin-actions">
      <button class="primary" id="add-lanc">+ Lançamento</button>
      <button id="do-import">Importar planilha</button>
    </div>
    <div class="seg2" id="fin-tipo">
      <button data-t="saida">Saídas</button>
      <button data-t="entrada">Entradas</button>
    </div>
    <div id="fin-body"></div>
  </section>

  <!-- VIAGEM (fora da nav) -->
  <section class="view" id="v-form">
    <div class="form">
      <input type="hidden" id="f-id">
      <div class="field"><label>Cliente</label><input id="f-cliente" placeholder="Nome do cliente"></div>
      <div class="field"><label>Contato</label><input id="f-contato" class="mono" inputmode="tel" placeholder="WhatsApp / telefone"></div>
      <div class="field"><label>Categoria</label><select id="f-cat"></select></div>
      <div class="grid2">
        <div class="field"><label>Origem</label><input id="f-origem" placeholder="Saída"></div>
        <div class="field"><label>Destino</label><input id="f-destino" placeholder="Chegada"></div>
      </div>
      <div class="field"><label>Data</label><input id="f-data" type="date" class="mono"></div>
      <div class="grid2">
        <div class="field"><label>Horário de saída</label><input id="f-saida" type="time" class="mono"></div>
        <div class="field"><label>Horário de retorno</label><input id="f-retorno" type="time" class="mono"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Tempo de espera</label><input id="f-espera" class="mono" inputmode="numeric" placeholder="minutos"><div class="hint" id="h-espera">0h00</div></div>
        <div class="field"><label>Pessoas</label><input id="f-pessoas" class="mono" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Valor da corrida (R$)</label><input id="f-corrida" class="mono" inputmode="decimal" placeholder="0,00"></div>
        <div class="field"><label>Valor da hora de espera (R$)</label><input id="f-hora" class="mono" inputmode="decimal" placeholder="0,00"></div>
      </div>
      <div class="calc"><div class="k">Total da viagem</div><div class="v" id="f-total">R$ 0,00</div></div>
      <div class="field"><label>Recebimento</label>
        <div class="seg" id="f-status">
          <button type="button" data-st="aberto"><span class="d"></span>Em aberto</button>
          <button type="button" data-st="pago"><span class="d"></span>Pago</button>
          <button type="button" data-st="quitado"><span class="d"></span>Quitado</button>
        </div>
      </div>
      <div class="field"><label>Notificação do agendamento</label>
        <div class="switch-row"><span>Avisar antes da saída</span><div class="sw" id="f-notif"></div></div>
        <div class="grid2" id="notif-when" style="margin-top:10px">
          <div class="field" style="margin:0"><input id="f-notifmin" class="mono" inputmode="numeric" placeholder="30"><div class="hint">minutos antes</div></div>
          <div class="field" style="margin:0;display:flex;align-items:center;color:var(--muted);font-size:12px" id="notif-preview"></div>
        </div>
      </div>
      <div class="field"><label>Observação</label><textarea id="f-obs" rows="2" placeholder="Opcional"></textarea></div>
      <button class="btn" id="save">Salvar viagem</button>
      <button class="btn danger" id="del" style="display:none">Excluir viagem</button>
    </div>
  </section>

  <!-- RECEBIMENTOS -->
  <section class="view" id="v-receb">
    <div class="filters" id="rec-filters">
      <button class="chip sel" data-f="todos">Todas viagens</button>
      <button class="chip" data-f="aberto">Em aberto</button>
      <button class="chip" data-f="pago">Pago</button>
      <button class="chip" data-f="quitado">Quitado</button>
    </div>
    <div id="rec-list"></div>
  </section>

  <!-- CATEGORIAS -->
  <section class="view" id="v-cats">
    <div class="seg2" id="cat-tipo">
      <button data-t="saida">Saídas</button>
      <button data-t="entrada">Entradas</button>
    </div>
    <div id="cat-list"></div>
    <button class="btn ghost" id="add-cat">+ Nova categoria</button>
  </section>
</main>

<button class="fab" id="fab">+</button>

<nav class="nav">
  <button data-tab="agenda" class="sel"><span class="i">🗓️</span>Agenda</button>
  <button data-tab="fin"><span class="i">💰</span>Financeiro</button>
  <button data-tab="receb"><span class="i">✅</span>Recebimentos</button>
  <button data-tab="cats"><span class="i">🏷️</span>Categorias</button>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Storage: window.storage → localStorage → memória ===== */
const Store = (() => {
  const has = typeof window!=='undefined' && window.storage && window.storage.get;
  const mem = {};
  return {
    async get(k){
      try{
        if(has){ const r = await window.storage.get(k); return r? JSON.parse(r.value): null; }
        const v = localStorage.getItem(k); return v? JSON.parse(v): null;
      }catch(e){ return mem[k] ?? null; }
    },
    async set(k,val){
      const s = JSON.stringify(val); mem[k]=val;
      try{ if(has){ await window.storage.set(k,s,false); } else { localStorage.setItem(k,s); } }catch(e){}
    }
  };
})();

/* ===== Estado ===== */
let VIAGENS=[], LANCS=[], CATS=[];
let filtroRec='todos', formStatus='aberto', formNotif=false;
let fMonth=new Date(); fMonth.setDate(1);
let finTipo='saida', catTipo='saida';

const ICONES=['🚗','🚙','🚐','🚕','🛻','🏍️','✈️','🏥','🏢','🏖️','🎓','⛪','🛒','🎉','📦','⭐','🧳','🗺️','⛽','🔧','🛣️','🍲','💊','🏠','📱','💰','🍺','🐶'];
const CORES=['#3B6EF6','#16B364','#F5A524','#F5555D','#9B7EDE','#22B8CF','#E64980','#96A38C','#4C9AFF','#F76707','#2F9E44','#748FFC','#12B886','#FA5252','#845EF7','#868E96'];
const CATS_PADRAO=[
  {id:'e1',nome:'Viagens',icone:'🚗',cor:'#96A38C',tipo:'entrada'},
  {id:'e2',nome:'Ponto',icone:'🚕',cor:'#E64980',tipo:'entrada'},
  {id:'e3',nome:'Aplicativo',icone:'🚙',cor:'#E64980',tipo:'entrada'},
  {id:'e4',nome:'Interliga',icone:'🗺️',cor:'#3B6EF6',tipo:'entrada'},
  {id:'e5',nome:'22 Mobilidade',icone:'🚐',cor:'#748FFC',tipo:'entrada'},
  {id:'s1',nome:'Gasolina',icone:'⛽',cor:'#F5A524',tipo:'saida'},
  {id:'s2',nome:'Alimentação',icone:'🍲',cor:'#F5555D',tipo:'saida'},
  {id:'s3',nome:'Manutenção',icone:'🔧',cor:'#E64980',tipo:'saida'},
  {id:'s4',nome:'Pedágio',icone:'🛣️',cor:'#96A38C',tipo:'saida'},
  {id:'s5',nome:'Parcela do carro',icone:'🚗',cor:'#4C9AFF',tipo:'saida'},
  {id:'s6',nome:'Lazer',icone:'🎉',cor:'#22B8CF',tipo:'saida'}
];

/* ===== Helpers ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'R$ '+Math.round(Number(n)||0).toLocaleString('pt-BR');
const num=v=>{ if(v==null)return 0; return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0; };
const catById=id=>CATS.find(c=>c.id===id)||{nome:'—',icone:'❓',cor:'#5C6A82'};
const catsBy=t=>CATS.filter(c=>c.tipo===t);
function hhmm(min){ min=Number(min)||0; const h=Math.floor(min/60), m=min%60; return h+'h'+String(m).padStart(2,'0'); }
function calcTotal(v){ return num(v.valorCorrida) + (Number(v.esperaMin)||0)/60*num(v.valorHoraEspera); }
const STLBL={aberto:'Em aberto',pago:'Pago',quitado:'Quitado'};
const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

function dataLabel(iso){
  if(!iso) return 'Sem data';
  const d=new Date(iso+'T00:00'), hoje=new Date(); hoje.setHours(0,0,0,0);
  const dif=Math.round((d-hoje)/86400000);
  const wd=['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];
  const base=`${wd} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  if(dif===0) return 'Hoje · '+base; if(dif===1) return 'Amanhã · '+base; if(dif===-1) return 'Ontem · '+base;
  return base;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2000); }

/* ===== Init ===== */
(async function init(){
  VIAGENS = await Store.get('viagens') || [];
  LANCS   = await Store.get('lancamentos') || [];
  CATS    = await Store.get('cats');
  if(!CATS || !CATS.length){ CATS=CATS_PADRAO.slice(); }
  CATS.forEach(c=>{ if(!c.tipo) c.tipo='entrada'; });
  if(!CATS.some(c=>c.tipo==='saida')) CATS.push(...CATS_PADRAO.filter(c=>c.tipo==='saida'));
  await Store.set('cats',CATS);

  bindNav(); bindForm(); bindCats(); bindReceb(); bindFin();
  $('#bell').onclick=askNotif; $('#fab').onclick=()=>openForm(null);
  refreshNotifPerm(); renderAll(); scheduleAll();
})();

const saveViagens=()=>Store.set('viagens',VIAGENS);
const saveLancs=()=>Store.set('lancamentos',LANCS);
const saveCats=()=>Store.set('cats',CATS);

/* ===== Render geral ===== */
function renderAll(){ renderStrip(); renderAgenda(); renderReceb(); renderCats(); renderFin(); fillCatSelect(); }

function renderStrip(){
  const receb=VIAGENS.filter(v=>v.status!=='aberto').reduce((s,v)=>s+calcTotal(v),0);
  const aberto=VIAGENS.filter(v=>v.status==='aberto').reduce((s,v)=>s+calcTotal(v),0);
  const hoje=new Date().toISOString().slice(0,10);
  const nHoje=VIAGENS.filter(v=>v.data===hoje).length;
  $('#strip').innerHTML=`
    <div class="stat"><div class="k">Viagens hoje</div><div class="v">${nHoje}</div></div>
    <div class="stat up"><div class="k">Recebido</div><div class="v">${money0(receb)}</div></div>
    <div class="stat down"><div class="k">Em aberto</div><div class="v">${money0(aberto)}</div></div>`;
}

/* ===== Agenda ===== */
function renderAgenda(){
  const el=$('#agenda-list');
  if(!VIAGENS.length){
    el.innerHTML=`<div class="empty"><div class="big">🗓️</div><b>Nenhuma viagem agendada</b><br>Toque no botão <b>+</b> para registrar a primeira corrida.</div>`;
    return;
  }
  const ord=[...VIAGENS].sort((a,b)=>(a.data+a.saida).localeCompare(b.data+b.saida));
  const hoje=new Date().toISOString().slice(0,10);
  let html='', dia=null;
  for(const v of ord){
    if(v.data!==dia){ dia=v.data; html+=`<div class="daylabel ${dia===hoje?'today':''}">${dataLabel(dia)}</div>`; }
    html+=cardHTML(v);
  }
  el.innerHTML=html;
  $$('#agenda-list .card').forEach(c=>c.onclick=()=>openForm(c.dataset.id));
}
function cardHTML(v){
  const c=catById(v.categoriaId), tot=calcTotal(v);
  const rota=(v.origem||v.destino)?`<div class="route"><b>${v.origem||'—'}</b> → <b>${v.destino||'—'}</b></div>`:'';
  const espera=v.esperaMin>0?`<span>⏱ espera <span class="mono">${hhmm(v.esperaMin)}</span></span>`:'';
  const pess=v.pessoas>0?`<span>👤 <span class="mono">${v.pessoas}</span></span>`:'';
  const notif=v.notificar?`<span class="notif-tag">🔔 ${v.notifMin||30}min</span>`:'';
  return `<div class="card" data-id="${v.id}">
    <div class="light" style="background:${c.cor}"></div>
    <div class="head"><div><div class="cli">${v.cliente||'Sem nome'}</div>
      <div class="cat-tag"><span class="cat-dot" style="background:${c.cor}"></span>${c.icone} ${c.nome}${notif}</div></div>
      <span class="pill ${v.status}"><span class="d"></span>${STLBL[v.status]}</span></div>
    <div class="rail"><span class="time">${v.saida||'--:--'}</span><span class="arr">→</span><span class="time">${v.retorno||'--:--'}</span></div>
    ${rota}<div class="meta">${pess}${espera}${v.contato?`<span>📞 <span class="mono">${v.contato}</span></span>`:''}</div>
    <div class="foot"><div class="total">${money(tot)}</div><span style="color:var(--faint);font-size:12px">editar ›</span></div></div>`;
}

/* ===== Financeiro ===== */
function bindFin(){
  $('#m-prev').onclick=()=>{fMonth.setMonth(fMonth.getMonth()-1);renderFin();};
  $('#m-next').onclick=()=>{fMonth.setMonth(fMonth.getMonth()+1);renderFin();};
  $$('#fin-tipo button').forEach(b=>b.onclick=()=>{finTipo=b.dataset.t;renderFin();});
  $('#add-lanc').onclick=()=>lancSheet(null);
  $('#do-import').onclick=importSheet;
}
function renderFin(){
  const mk=monthKey(fMonth);
  $('#m-lbl').textContent=fMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const mon=LANCS.filter(l=>(l.data||'').startsWith(mk));
  const ent=mon.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+num(l.valor),0);
  const sai=mon.filter(l=>l.tipo==='saida').reduce((s,l)=>s+num(l.valor),0);
  const sal=ent-sai;
  $('#t-ent').textContent=money0(ent); $('#t-sai').textContent=money0(sai);
  const sv=$('#t-sal'); sv.textContent=money0(sal); sv.className='v '+(sal<0?'neg':'pos');

  $$('#fin-tipo button').forEach(b=>{ b.className=''; if(b.dataset.t===finTipo) b.classList.add('sel',finTipo); });

  const typed=mon.filter(l=>l.tipo===finTipo);
  const totT=typed.reduce((s,l)=>s+num(l.valor),0);
  const body=$('#fin-body');
  if(!typed.length){
    body.innerHTML=`<div class="empty"><div class="big">${finTipo==='saida'?'📉':'📈'}</div><b>Sem ${finTipo==='saida'?'saídas':'entradas'} em ${fMonth.toLocaleDateString('pt-BR',{month:'long'})}</b><br>Toque em <b>+ Lançamento</b> ou <b>Importar planilha</b>.</div>`;
    return;
  }
  const byCat={};
  typed.forEach(l=>{ byCat[l.catId]=(byCat[l.catId]||0)+num(l.valor); });
  const rows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  let html='<div class="sec-h"><h2>Por categoria</h2></div>';
  for(const [cid,val] of rows){
    const c=catById(cid), pct=totT?Math.round(val/totT*100):0;
    html+=`<div class="brk"><div class="top">
      <div class="ico" style="background:${c.cor}33;color:${c.cor}">${c.icone}</div>
      <div class="nm">${c.nome}</div><div class="pct">${pct}%</div><div class="val">${money(val)}</div></div>
      <div class="bar"><i style="width:${pct}%;background:${c.cor}"></i></div></div>`;
  }
  html+='<div class="sec-h"><h2>Lançamentos</h2></div>';
  typed.sort((a,b)=>(b.data||'').localeCompare(a.data||'')).forEach(l=>{
    const c=catById(l.catId);
    html+=`<div class="lanc" data-id="${l.id}">
      <div class="ico" style="background:${c.cor}33;color:${c.cor}">${c.icone}</div>
      <div class="info"><div class="n">${c.nome}${l.obs?' · '+l.obs:''}</div>
        <div class="s">${(l.data||'').split('-').reverse().join('/')} · ${STLBL[l.status]||''}</div></div>
      <div class="amt ${l.tipo}">${l.tipo==='saida'?'-':'+'}${money(num(l.valor))}</div></div>`;
  });
  body.innerHTML=html;
  $$('#fin-body .lanc').forEach(x=>x.onclick=()=>lancSheet(x.dataset.id));
}

function lancSheet(id){
  const l=id?LANCS.find(x=>x.id===id):{tipo:finTipo,catId:'',valor:'',data:new Date().toISOString().slice(0,10),status:'pago',obs:''};
  let tipo=l.tipo;
  const catOpts=t=>catsBy(t).map(c=>`<option value="${c.id}">${c.icone}  ${c.nome}</option>`).join('');
  $('#sheet').innerHTML=`
    <h3>${id?'Editar lançamento':'Novo lançamento'}</h3>
    <div class="field"><label>Tipo</label><div class="seg" id="l-tipo">
      <button data-t="saida"><span class="d"></span>Saída</button>
      <button data-t="entrada"><span class="d"></span>Entrada</button></div></div>
    <div class="field"><label>Categoria</label><select id="l-cat">${catOpts(tipo)}</select></div>
    <div class="field"><label>Valor (R$)</label><input id="l-valor" class="mono" inputmode="decimal" value="${l.valor!==''?String(l.valor).replace('.',','):''}" placeholder="0,00"></div>
    <div class="field"><label>Data</label><input id="l-data" type="date" class="mono" value="${l.data||''}"></div>
    <div class="field"><label>Situação</label><div class="seg" id="l-status">
      <button data-st="aberto"><span class="d"></span>Em aberto</button>
      <button data-st="pago"><span class="d"></span>Pago</button>
      <button data-st="quitado"><span class="d"></span>Quitado</button></div></div>
    <div class="field"><label>Observação</label><input id="l-obs" value="${l.obs||''}" placeholder="Opcional"></div>
    <button class="btn" id="l-save">Salvar</button>
    ${id?'<button class="btn danger" id="l-del">Excluir</button>':''}`;
  openSheet();
  const selTipo=t=>{tipo=t;$$('#l-tipo button').forEach(b=>{b.className='';if(b.dataset.t===t)b.classList.add('sel',t);});$('#l-cat').innerHTML=catOpts(t);};
  const selSt=st=>$$('#l-status button').forEach(b=>{b.className='';if(b.dataset.st===st)b.classList.add('sel',st);});
  $$('#l-tipo button').forEach(b=>b.onclick=()=>selTipo(b.dataset.t));
  $$('#l-status button').forEach(b=>b.onclick=()=>selSt(b.dataset.st));
  selTipo(tipo); if(id)$('#l-cat').value=l.catId; selSt(l.status||'pago');
  $('#l-save').onclick=async()=>{
    const valor=num($('#l-valor').value); if(!valor)return toast('Informe o valor');
    if(!$('#l-cat').value)return toast('Escolha a categoria');
    const st=$$('#l-status button.sel')[0]?.dataset.st||'pago';
    const rec={id:id||uid(),tipo,catId:$('#l-cat').value,valor,data:$('#l-data').value,status:st,obs:$('#l-obs').value.trim()};
    const i=LANCS.findIndex(x=>x.id===rec.id);
    if(i>=0)LANCS[i]=rec; else LANCS.push(rec);
    await saveLancs(); closeSheet(); renderFin(); toast(id?'Lançamento atualizado':'Lançamento salvo');
  };
  if(id)$('#l-del').onclick=async()=>{LANCS=LANCS.filter(x=>x.id!==id);await saveLancs();closeSheet();renderFin();toast('Excluído');};
}

/* ===== Importar planilha (CSV) ===== */
function detectDelim(line){
  const c=(line.match(/;/g)||[]).length, v=(line.match(/,/g)||[]).length, t=(line.match(/\t/g)||[]).length;
  if(t>=c&&t>=v)return '\t'; return c>=v?';':',';
}
function parseCSV(text,delim){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===delim){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch==='\r'){} else cur+=ch; } }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseValorBR(s){
  if(s==null)return 0; s=String(s).trim(); let neg=/^\(|-/.test(s);
  s=s.replace(/[^\d.,-]/g,'').replace(/[()]/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,'');
  let n=parseFloat(s)||0; return neg?-Math.abs(n):n;
}
function parseDataBR(s){
  if(!s)return ''; s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let[,d,mo,y]=m; if(y.length===2)y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return '';
}
let impRows=[], impHead=[], impTipoMode='col';
function importSheet(){
  $('#sheet').innerHTML=`<h3>Importar planilha</h3>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 14px;line-height:1.5">Exporte sua planilha do Excel como <b>CSV</b> (Arquivo › Salvar como › CSV) e selecione o arquivo. Você confere tudo antes de gravar.</p>
    <input type="file" id="imp-file" accept=".csv,text/csv" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--ink)">
    <div id="imp-cfg"></div>`;
  openSheet();
  $('#imp-file').onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>impConfig(r.result); r.readAsText(f,'utf-8'); };
}
function impConfig(text){
  const delim=detectDelim((text.split('\n')[0]||''));
  const rows=parseCSV(text,delim); if(rows.length<2){toast('Planilha vazia ou ilegível');return;}
  impHead=rows[0].map(h=>h.trim()); impRows=rows.slice(1);
  const opts=(sel)=>impHead.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${h||('Coluna '+(i+1))}</option>`).join('');
  const guess=re=>{const i=impHead.findIndex(h=>re.test(h.toLowerCase()));return i<0?'':i;};
  const gData=guess(/data|dia|venc/), gCat=guess(/categ|descri|hist|nome|item/), gVal=guess(/valor|preç|total|r\$|amount/), gTipo=guess(/tipo|entrada|saída|saida|receita|despesa|d\/c/), gObs=guess(/obs|coment|nota/);
  $('#imp-cfg').innerHTML=`
    <div class="sec-h"><h2>Mapear colunas</h2></div>
    <div class="imp-map">
      <div class="field"><label>Data</label><select id="mp-data">${opts(gData)}</select></div>
      <div class="field"><label>Categoria</label><select id="mp-cat">${opts(gCat)}</select></div>
      <div class="field"><label>Valor</label><select id="mp-val">${opts(gVal)}</select></div>
      <div class="field"><label>Observação (opcional)</label><select id="mp-obs"><option value="">—</option>${opts(gObs)}</select></div>
    </div>
    <div class="field"><label>Como definir entrada/saída?</label>
      <div class="radios" id="mp-tipo">
        <button data-m="col" class="sel">Tenho coluna de tipo</button>
        <button data-m="sign">Pelo sinal (- = saída)</button>
        <button data-m="entrada">Tudo entrada</button>
        <button data-m="saida">Tudo saída</button>
      </div>
      <div id="mp-tipocol" class="field" style="margin-top:10px"><label>Coluna do tipo</label><select id="mp-tcol">${opts(gTipo)}</select></div>
    </div>
    <button class="btn ghost" id="imp-prev">Ver prévia</button>
    <div id="imp-out"></div>`;
  impTipoMode='col';
  $$('#mp-tipo button').forEach(b=>b.onclick=()=>{impTipoMode=b.dataset.m;$$('#mp-tipo button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#mp-tipocol').style.display=impTipoMode==='col'?'block':'none';});
  $('#imp-prev').onclick=impPreview;
}
function impBuild(){
  const ci={data:+$('#mp-data').value,cat:+$('#mp-cat').value,val:+$('#mp-val').value,
    obs:$('#mp-obs').value===''?-1:+$('#mp-obs').value,tcol:$('#mp-tcol')?+$('#mp-tcol').value:-1};
  return impRows.map(r=>{
    let valor=parseValorBR(r[ci.val]);
    let tipo='entrada';
    if(impTipoMode==='entrada')tipo='entrada';
    else if(impTipoMode==='saida')tipo='saida';
    else if(impTipoMode==='sign')tipo=valor<0?'saida':'entrada';
    else{ const t=(r[ci.tcol]||'').toLowerCase(); tipo=/sa|desp|deb|d\b|-/.test(t)&&!/entr|rec/.test(t)?'saida':'entrada'; }
    return {catNome:(r[ci.cat]||'').trim()||'Sem categoria',valor:Math.abs(valor),tipo,
      data:parseDataBR(r[ci.data])||new Date().toISOString().slice(0,10),obs:ci.obs>=0?(r[ci.obs]||'').trim():''};
  }).filter(x=>x.valor>0);
}
function impPreview(){
  const items=impBuild();
  if(!items.length){$('#imp-out').innerHTML='<div class="imp-sum">Nenhuma linha com valor válido. Confira a coluna de valor.</div>';return;}
  const ent=items.filter(i=>i.tipo==='entrada').reduce((s,i)=>s+i.valor,0);
  const sai=items.filter(i=>i.tipo==='saida').reduce((s,i)=>s+i.valor,0);
  let rows=items.slice(0,8).map(i=>`<tr><td>${i.data.split('-').reverse().join('/')}</td><td>${i.catNome}</td>
    <td>${i.tipo==='saida'?'Saída':'Entrada'}</td><td class="v ${i.tipo==='entrada'?'e':'s'}">${money(i.valor)}</td></tr>`).join('');
  $('#imp-out').innerHTML=`
    <div class="sec-h"><h2>Prévia (${items.length} lançamentos)</h2></div>
    <div class="prev"><table class="pv"><thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="imp-sum">+ ${money(ent)} entradas &nbsp;·&nbsp; - ${money(sai)} saídas &nbsp;·&nbsp; importados como <b>Pago</b></div>
    <button class="btn" id="imp-go">Importar ${items.length} lançamentos</button>`;
  $('#imp-go').onclick=()=>impCommit(items);
}
async function impCommit(items){
  for(const it of items){
    let c=CATS.find(x=>x.tipo===it.tipo && x.nome.toLowerCase()===it.catNome.toLowerCase());
    if(!c){ c={id:uid(),nome:it.catNome,icone:it.tipo==='saida'?'💰':'🚗',cor:it.tipo==='saida'?'#F5555D':'#16B364',tipo:it.tipo}; CATS.push(c); }
    LANCS.push({id:uid(),tipo:it.tipo,catId:c.id,valor:it.valor,data:it.data,status:'pago',obs:it.obs});
  }
  await saveCats(); await saveLancs(); closeSheet(); renderAll(); toast(items.length+' lançamentos importados');
}

/* ===== Recebimentos (viagens) ===== */
function bindReceb(){ $$('#rec-filters .chip').forEach(b=>b.onclick=()=>{
  $$('#rec-filters .chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); filtroRec=b.dataset.f; renderReceb(); }); }
function renderReceb(){
  const el=$('#rec-list');
  let list=[...VIAGENS].sort((a,b)=>(b.data+b.saida).localeCompare(a.data+a.saida));
  if(filtroRec!=='todos') list=list.filter(v=>v.status===filtroRec);
  if(!list.length){ el.innerHTML=`<div class="empty"><div class="big">✅</div><b>Nada por aqui</b><br>Sem viagens neste filtro.</div>`; return; }
  el.innerHTML=list.map(v=>{ const c=catById(v.categoriaId);
    return `<div class="card" data-id="${v.id}"><div class="light" style="background:${c.cor}"></div>
      <div class="head"><div><div class="cli">${v.cliente||'Sem nome'}</div>
        <div class="cat-tag"><span class="cat-dot" style="background:${c.cor}"></span>${dataLabel(v.data)} · ${v.saida||'--:--'}</div></div>
        <span class="pill ${v.status}"><span class="d"></span>${STLBL[v.status]}</span></div>
      <div class="foot"><div class="total">${money(calcTotal(v))}</div></div>
      <div class="quick"><button data-go="aberto" data-id="${v.id}">Em aberto</button>
        <button class="go-pago" data-go="pago" data-id="${v.id}">Pago</button>
        <button class="go-quit" data-go="quitado" data-id="${v.id}">Quitar</button></div></div>`;
  }).join('');
  $$('#rec-list .quick button').forEach(b=>b.onclick=async e=>{ e.stopPropagation();
    const v=VIAGENS.find(x=>x.id===b.dataset.id); v.status=b.dataset.go; await saveViagens(); renderAll(); toast('Status: '+STLBL[b.dataset.go]); });
  $$('#rec-list .card').forEach(c=>c.onclick=()=>openForm(c.dataset.id));
}

/* ===== Categorias ===== */
function fillCatSelect(){ const sel=$('#f-cat'),cur=sel.value;
  sel.innerHTML=catsBy('entrada').map(c=>`<option value="${c.id}">${c.icone}  ${c.nome}</option>`).join('');
  if(cur&&CATS.some(c=>c.id===cur))sel.value=cur; }
function bindCats(){ $('#add-cat').onclick=()=>catSheet(null);
  $$('#cat-tipo button').forEach(b=>b.onclick=()=>{catTipo=b.dataset.t;renderCats();}); }
function renderCats(){
  $$('#cat-tipo button').forEach(b=>{b.className='';if(b.dataset.t===catTipo)b.classList.add('sel',catTipo);});
  $('#cat-list').innerHTML=catsBy(catTipo).map(c=>`
    <div class="cat-item"><div class="cat-ico" style="background:${c.cor}33;color:${c.cor}">${c.icone}</div>
      <div class="nm">${c.nome}</div><button class="ed" data-id="${c.id}">✏️</button></div>`).join('')
    || `<div class="empty"><b>Nenhuma categoria de ${catTipo==='saida'?'saída':'entrada'}</b></div>`;
  $$('#cat-list .ed').forEach(b=>b.onclick=()=>catSheet(b.dataset.id));
}
function catSheet(id){
  const c=id?CATS.find(x=>x.id===id):{nome:'',icone:catTipo==='saida'?'💰':'🚗',cor:catTipo==='saida'?'#F5555D':'#16B364',tipo:catTipo};
  let ic=c.icone,cor=c.cor,tp=c.tipo;
  $('#sheet').innerHTML=`<h3>${id?'Editar categoria':'Nova categoria'}</h3>
    <div class="field"><label>Tipo</label><div class="seg" id="cs-tipo">
      <button data-t="saida"><span class="d"></span>Saída</button>
      <button data-t="entrada"><span class="d"></span>Entrada</button></div></div>
    <div class="field"><label>Nome</label><input id="cs-nome" value="${c.nome}" placeholder="Ex.: Aeroporto"></div>
    <div class="field"><label>Ícone</label><div class="icogrid" id="cs-icos">${ICONES.map(i=>`<button data-i="${i}" class="${i===ic?'sel':''}">${i}</button>`).join('')}</div></div>
    <div class="field"><label>Cor</label><div class="colgrid" id="cs-cols">${CORES.map(cc=>`<button data-c="${cc}" style="background:${cc}" class="${cc===cor?'sel':''}"></button>`).join('')}</div></div>
    <button class="btn" id="cs-save">Salvar</button>
    ${id?'<button class="btn danger" id="cs-del">Excluir categoria</button>':''}`;
  openSheet();
  const selT=t=>{tp=t;$$('#cs-tipo button').forEach(b=>{b.className='';if(b.dataset.t===t)b.classList.add('sel',t);});};
  $$('#cs-tipo button').forEach(b=>b.onclick=()=>selT(b.dataset.t)); selT(tp);
  $$('#cs-icos button').forEach(b=>b.onclick=()=>{ic=b.dataset.i;$$('#cs-icos button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
  $$('#cs-cols button').forEach(b=>b.onclick=()=>{cor=b.dataset.c;$$('#cs-cols button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
  $('#cs-save').onclick=async()=>{ const nome=$('#cs-nome').value.trim(); if(!nome)return toast('Dê um nome');
    if(id)Object.assign(CATS.find(x=>x.id===id),{nome,icone:ic,cor,tipo:tp});
    else CATS.push({id:uid(),nome,icone:ic,cor,tipo:tp});
    await saveCats(); closeSheet(); catTipo=tp; renderAll(); toast('Categoria salva'); };
  if(id)$('#cs-del').onclick=async()=>{
    if(VIAGENS.some(v=>v.categoriaId===id)||LANCS.some(l=>l.catId===id))return toast('Há registros nesta categoria');
    CATS=CATS.filter(x=>x.id!==id); await saveCats(); closeSheet(); renderAll(); toast('Excluída'); };
}

/* ===== Formulário de viagem ===== */
function bindForm(){
  $('#f-status').querySelectorAll('button').forEach(b=>b.onclick=()=>setStatus(b.dataset.st));
  $('#f-notif').onclick=()=>{formNotif=!formNotif;syncNotifUI();};
  ['f-corrida','f-hora','f-espera'].forEach(id=>$('#'+id).addEventListener('input',liveTotal));
  $('#f-espera').addEventListener('input',()=>$('#h-espera').textContent=hhmm(num($('#f-espera').value)));
  ['f-data','f-saida','f-notifmin'].forEach(id=>$('#'+id).addEventListener('input',notifPreview));
  $('#save').onclick=saveViagem; $('#del').onclick=delViagem;
}
function setStatus(st){formStatus=st;$$('#f-status button').forEach(b=>{b.className='';if(b.dataset.st===st)b.classList.add('sel',st);});}
function syncNotifUI(){$('#f-notif').classList.toggle('on',formNotif);$('#notif-when').style.display=formNotif?'grid':'none';notifPreview();}
function liveTotal(){$('#f-total').textContent=money(num($('#f-corrida').value)+num($('#f-espera').value)/60*num($('#f-hora').value));}
function notifPreview(){const p=$('#notif-preview');if(!formNotif){p.textContent='';return;}
  const d=$('#f-data').value,t=$('#f-saida').value,m=Number($('#f-notifmin').value)||30;
  if(!d||!t){p.textContent='defina data e saída';return;}
  const w=new Date(new Date(d+'T'+t).getTime()-m*60000);
  p.textContent='avisa '+w.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function openForm(id){
  const v=id?VIAGENS.find(x=>x.id===id):null;
  $('#f-id').value=id||'';
  $('#f-cliente').value=v?.cliente||'';$('#f-contato').value=v?.contato||'';
  $('#f-origem').value=v?.origem||'';$('#f-destino').value=v?.destino||'';
  $('#f-data').value=v?.data||new Date().toISOString().slice(0,10);
  $('#f-saida').value=v?.saida||'';$('#f-retorno').value=v?.retorno||'';
  $('#f-espera').value=v?.esperaMin||'';$('#h-espera').textContent=hhmm(v?.esperaMin||0);
  $('#f-pessoas').value=v?.pessoas||'';
  $('#f-corrida').value=v?String(v.valorCorrida).replace('.',','):'';
  $('#f-hora').value=v?String(v.valorHoraEspera).replace('.',','):'';
  $('#f-obs').value=v?.obs||'';$('#f-notifmin').value=v?.notifMin||30;
  setStatus(v?.status||'aberto');formNotif=v?.notificar||false;syncNotifUI();
  fillCatSelect(); if(v)$('#f-cat').value=v.categoriaId; liveTotal();
  $('#del').style.display=id?'block':'none';
  showView('form');
}
async function saveViagem(){
  const cliente=$('#f-cliente').value.trim(); if(!cliente)return toast('Informe o cliente');
  if(!$('#f-data').value||!$('#f-saida').value)return toast('Preencha data e horário de saída');
  const id=$('#f-id').value||uid();
  const rec={id,cliente,contato:$('#f-contato').value.trim(),categoriaId:$('#f-cat').value,
    origem:$('#f-origem').value.trim(),destino:$('#f-destino').value.trim(),data:$('#f-data').value,
    saida:$('#f-saida').value,retorno:$('#f-retorno').value,esperaMin:Number($('#f-espera').value)||0,
    pessoas:Number($('#f-pessoas').value)||0,valorCorrida:num($('#f-corrida').value),valorHoraEspera:num($('#f-hora').value),
    status:formStatus,notificar:formNotif,notifMin:Number($('#f-notifmin').value)||30,obs:$('#f-obs').value.trim()};
  const i=VIAGENS.findIndex(v=>v.id===id); if(i>=0)VIAGENS[i]=rec; else VIAGENS.push(rec);
  await saveViagens(); renderAll(); scheduleAll(); switchTab('agenda'); toast(i>=0?'Viagem atualizada':'Viagem agendada');
}
async function delViagem(){const id=$('#f-id').value;if(!id)return;
  VIAGENS=VIAGENS.filter(v=>v.id!==id);await saveViagens();renderAll();switchTab('agenda');toast('Viagem excluída');}

/* ===== Notificações ===== */
const timers=[];
async function askNotif(){ if(!('Notification' in window))return toast('Notificação não suportada neste aparelho');
  const p=await Notification.requestPermission(); refreshNotifPerm();
  if(p==='granted'){toast('Notificações ativadas');scheduleAll();} else toast('Permissão negada'); }
function refreshNotifPerm(){ const on=('Notification' in window)&&Notification.permission==='granted';
  $('#bell').classList.toggle('on',on);$('#bell').classList.toggle('off',!on); }
function scheduleAll(){ timers.forEach(clearTimeout);timers.length=0;
  if(!('Notification' in window)||Notification.permission!=='granted')return; const now=Date.now();
  VIAGENS.filter(v=>v.notificar&&v.data&&v.saida).forEach(v=>{
    const fire=new Date(v.data+'T'+v.saida).getTime()-(v.notifMin||30)*60000, delay=fire-now;
    if(delay>0&&delay<24*3600*1000) timers.push(setTimeout(()=>{
      new Notification('Viagem de '+v.cliente,{body:`Saída ${v.saida} · ${v.origem||''} → ${v.destino||''}`}); },delay)); }); }

/* ===== Navegação ===== */
function bindNav(){ $$('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab)); }
function showView(tab){ $$('.view').forEach(v=>v.classList.remove('active')); $('#v-'+tab).classList.add('active');
  $('#fab').classList.toggle('show',tab==='agenda');
  const titles={agenda:'Agenda de Viagens',fin:'Controle Financeiro',receb:'Recebimentos',cats:'Categorias',form:'Viagem'};
  $('#brand-title').textContent=titles[tab]||'22 Mobilidade'; window.scrollTo({top:0}); }
function switchTab(tab){ showView(tab); $$('.nav button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab)); }
function openSheet(){$('#scrim').classList.add('on');} function closeSheet(){$('#scrim').classList.remove('on');}
$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet();};
</script>
</body>
</html>
